/* ---------- Importar el tablero anterior ---------- */
async function importOld(file){try{const o=JSON.parse(await file.text());const st=o.estado||o;if(!st||!Array.isArray(st.acts))throw 0;
  const findP=n=>{n=String(n||'').trim();if(!n)return '';let p=L('personas').find(x=>norm(x.nombre)===norm(n));if(!p){p={id:uid('p'),nombre:n,grupo:'c0',telefono:'',habilidades:[],provincia:''};put('personas',p,50)}return p.id};
  const types=['masiva','cerrada','equipo'];let nt=0,ni=0,na=0;
  st.acts.forEach(x=>{if(!x.date)return;let a=L('actividades').find(y=>y.desde===x.date&&(norm(y.nombre)===norm(x.name)||(y.hasta||'')===(x.end||'')));
    if(!a){a={id:uid('a'),nombre:x.name||'Actividad',tipo:types[+x.type]||'masiva',estado:'idea',desde:x.date,hasta:x.end||'',hora:'',lugar:x.place||'',corrId:'',objetivo:x.goal||'',roles:[],momentos:[],itinerario:[],materiales:[],ideas:[],evaluacion:{}};na++}
    else{if(!a.objetivo&&x.goal)a.objetivo=x.goal;if(!a.lugar&&x.place)a.lugar=x.place;if(x.type!==''&&x.type!=null)a.tipo=types[+x.type]||a.tipo}
    if(x.resp&&!(a.roles||[]).length)a.roles=[{id:uid('rol'),rol:'Coordinador general',personaId:findP(x.resp)}];
    (x.ideas||[]).forEach(i=>{if(!(a.ideas||[]).some(z=>z.texto===i.text)){(a.ideas=a.ideas||[]).push({texto:i.text,autor:i.by||''});ni++}});
    if(x.notes&&!(a.notasTablero))a.notasTablero=x.notes;
    put('actividades',a,50);
    (x.tasks||[]).forEach(t=>{if(L('tareas').some(z=>z.importId===t.id))return;put('tareas',newTaskObj({titulo:t.text,responsableId:findP(t.resp),fecha:t.due||'',estado:t.done?'hecha':'pendiente',hechaEl:t.done?today():'',origen:{tipo:'actividad',id:a.id},actividadId:a.id,importId:t.id,notas:t.by?'Propuesta por '+t.by:''}),50);nt++})});
  if(st.sched&&Object.keys(st.sched).length){let h=L('horarios').find(y=>y.tipo==='semanal'&&/centro/i.test(y.nombre||''));if(!h){const b=HOR_TIPOS.semanal;h={id:uid('h'),nombre:'Disponibilidad en el centro',tipo:'semanal',cols:b.cols.slice(),rows:b.rows.slice(),celdas:{},notas:''}}
    h.celdas=h.celdas||{};Object.entries(st.sched).forEach(([k,names])=>{const [dj,si]=k.split('-');const key=si+'-'+dj;const cur=h.celdas[key]||[];(names||[]).forEach(n=>{if(!cur.includes(n))cur.push(n)});h.celdas[key]=cur});put('horarios',h,50)}
  if((st.gen&&st.gen.trim())||(st.who&&st.who.trim())||(st.trans&&st.trans.trim())){const d=st.mdate||today();let r=L('reuniones').find(y=>y.fecha===d&&y.origenTablero);
    if(!r){r={id:uid('r'),titulo:'Reunión de equipo (tablero)',fecha:d,hora:'',tipo:'equipo',estado:'terminada',lugar:'',temas:[],asistentes:[],ideas:[],apuntes:'',origenTablero:true}}
    r.apuntes=st.gen||r.apuntes;r.transcripcion=st.trans||r.transcripcion||'';r.asistentes=String(st.who||'').split(/[,\n;]/).map(s=>s.trim()).filter(Boolean).map(n=>({personaId:findP(n),presente:true}));
    r.temas=st.acts.filter(x=>(x.tasks||[]).length||(x.ideas||[]).length||x.notes).map(x=>{const a=L('actividades').find(y=>y.desde===x.date&&norm(y.nombre)===norm(x.name))||L('actividades').find(y=>y.desde===x.date);return {id:uid('tm'),texto:x.name||'Actividad',ok:true,notas:x.notes||'',actividadId:a?a.id:''}});
    r.minuta=r.minuta||{generada:new Date().toISOString(),resumen:'Importada del tablero anterior'};put('reuniones',r,50)}
  const g=S.config.general||{id:'general'};g.importadoTablero=new Date().toISOString();put('config',g,50);
  toast(`Importado: ${na} actividades nuevas, ${nt} tareas, ${ni} ideas`);render()}catch(e){toast('Ese archivo no es del Tablero de Reunión')}}

/* ---------- Archivos: PDF, ZIP ---------- */
async function saveFile(name,data){if(!DL){toast('Inicia sesión para descargar archivos');return false}
  try{await DL.save({filename:name,data});return true}catch(e){if(e&&e.code!=='declined'&&e.code!=='cancelled')toast('No se pudo descargar el archivo');return false}}
const pdfTxt=s=>String(s??'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/•/g,'-').replace(/…/g,'...').replace(/[^\x09\x0A\x0D\x20-\xFF]/g,'');
function PDF(title,subtitle){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'letter'});const W=215.9,H=279.4,M=16,CW=W-2*M;let y=M;
  const navy=[11,42,92],ink=[11,31,58],mut=[90,107,133],cyan=[0,207,224],blue=[30,94,255];
  doc.setFillColor(...navy);doc.rect(0,0,W,30,'F');doc.setFillColor(...blue);doc.triangle(W-70,0,W,0,W,30,'F');doc.setFillColor(...cyan);doc.triangle(W-30,0,W,0,W,30,'F');
  try{doc.setFillColor(255,255,255);doc.roundedRect(M,5,34,20,3,3,'F');doc.addImage(LOGO,'PNG',M+2,7,30,13.6)}catch(e){}
  doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(255,255,255);doc.text(pdfTxt(title),M+40,14,{maxWidth:CW-80});
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(200,215,255);if(subtitle)doc.text(pdfTxt(subtitle),M+40,21,{maxWidth:CW-80});
  y=40;const ensure=h=>{if(y+h>H-18){doc.addPage();y=M}};
  const api={doc,
   h(t){ensure(14);y+=2;doc.setFont('helvetica','bold');doc.setFontSize(12.5);doc.setTextColor(...navy);doc.text(pdfTxt(t),M,y);y+=2;doc.setDrawColor(...cyan);doc.setLineWidth(.6);doc.line(M,y,M+24,y);y+=5;return api},
   p(t,o={}){if(!t)return api;doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(o.size||10.5);doc.setTextColor(...(o.muted?mut:ink));doc.splitTextToSize(pdfTxt(t),CW-(o.indent||0)).forEach(l=>{ensure(5.2);doc.text(l,M+(o.indent||0),y);y+=5});y+=o.gap??1.5;return api},
   kv(rows){rows.filter(r=>r[1]!==''&&r[1]!=null).forEach(([k,v])=>{doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...mut);const ls=doc.splitTextToSize(pdfTxt(v),CW-44);ensure(5.2*ls.length);doc.text(pdfTxt(k),M,y);doc.setFont('helvetica','normal');doc.setTextColor(...ink);ls.forEach((l,i)=>doc.text(l,M+44,y+i*5));y+=5*ls.length+1});y+=2;return api},
   bullets(xs){xs.filter(Boolean).forEach(x=>{doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(...ink);const ls=doc.splitTextToSize(pdfTxt(x),CW-6);ensure(5.2*ls.length);doc.text('-',M+1,y);ls.forEach((l,i)=>doc.text(l,M+6,y+i*5));y+=5*ls.length+.6});y+=2;return api},
   table(head,rows,ws,foot){const tot=ws.reduce((a,b)=>a+b,0);const w=ws.map(x=>x/tot*CW);const line=(cells,bold,fill)=>{doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(9.5);
      const ls=cells.map((c,i)=>doc.splitTextToSize(pdfTxt(c),w[i]-3));const h=Math.max(...ls.map(l=>l.length))*4.6+3;ensure(h);
      if(fill){doc.setFillColor(...fill);doc.rect(M,y-4,CW,h,'F')}doc.setTextColor(...(bold&&fill?[255,255,255]:ink));let x=M;ls.forEach((l,i)=>{l.forEach((t,j)=>doc.text(t,x+1.5,y+j*4.6));x+=w[i]});y+=h;doc.setDrawColor(219,227,240);doc.setLineWidth(.2);doc.line(M,y-4,W-M,y-4)};
     line(head,true,navy);rows.forEach(r=>line(r,false));if(foot)line(foot,true);y+=4;return api},
   blob(){const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...mut);doc.text(pdfTxt(`UNE Juventud · Centro de mando · ${flong(today())}`),M,H-9);doc.text(`${i} / ${n}`,W-M,H-9,{align:'right'})}return doc.output('blob')}};
  return api}
function minutaResumen(r){return `${(r.asistentes||[]).filter(a=>a.presente).length} asistentes, ${(r.temas||[]).length} temas, ${tasksOf('reunion',r.id).length} acuerdos`}
function minutaPdf(r){const att=r.asistentes||[];const name=a=>a.personaId?pname(a.personaId):a.nombre;
  const P=PDF('Minuta de reunión',`${r.titulo||'Reunión'} · ${r.fecha?flong(r.fecha):''}`);
  P.kv([['Reunión',r.titulo||''],['Fecha',r.fecha?flong(r.fecha):''],['Horario',[tm(r.hora),tm(r.horaFin)].filter(Boolean).join(' a ')],['Lugar',r.lugar||''],['Minuta',r.minuta?`generada el ${flong(r.minuta.generada.slice(0,10))}`:'borrador']]);
  P.h(`Asistentes (${att.filter(a=>a.presente).length} de ${att.length})`).p(att.filter(a=>a.presente).map(name).join(', ')||'Sin registro');
  const aus=att.filter(a=>!a.presente);if(aus.length)P.p('Ausentes: '+aus.map(name).join(', '),{muted:true});
  (r.temas||[]).forEach((t,i)=>{if(i===0)P.h('Orden del día y lo que se habló');P.p(`${i+1}. ${t.texto}${t.ok?'':' (pendiente)'}${t.actividadId&&S.actividades[t.actividadId]?' · Actividad: '+S.actividades[t.actividadId].nombre:''}`,{bold:true,gap:.5});if(t.notas)P.p(t.notas,{indent:5})});
  if(r.apuntes)P.h('Apuntes generales').p(r.apuntes);
  if((r.ideas||[]).length)P.h('Ideas').bullets(r.ideas.map(i=>i.texto+(i.autor?` (${i.autor})`:'')));
  const ts=tasksOf('reunion',r.id);if(ts.length)P.h('Acuerdos y responsables').table(['Acuerdo','Responsable','Fecha','Prioridad'],ts.map(t=>[t.titulo,pname(t.responsableId)||'Sin asignar',t.fecha?fdate(t.fecha):'-',PRIOS[t.prioridad]||'']),[48,22,15,12]);
  const byP={};ts.forEach(t=>{const n=pname(t.responsableId)||'Sin asignar';(byP[n]=byP[n]||[]).push(t.titulo)});if(Object.keys(byP).length)P.h('Compromisos por persona').bullets(Object.entries(byP).map(([n,xs])=>`${n}: ${xs.join('; ')}`));
  if(r.transcripcion)P.h('Anexo: transcripción').p(r.transcripcion,{size:9,muted:true});return P}
function budgetRows(a){const b=budgetOf(a);return (a.materiales||[]).map(m=>{const q=(+m.cant||0)*(m.porPersona?b.n:1);return [m.item||'',fmt(q)+' '+(m.unidad||''),money(m.costo),FUENTES[m.fuente||'compra'],pname(m.responsableId)||'-',money(q*(+m.costo||0)),m.listo?'Sí':'No']})}
function actPdf(a){const P=PDF('Ficha de actividad',`${a.nombre||''} · ${a.desde?flong(a.desde):'sin fecha'}`);
  P.kv([['Actividad',a.nombre||''],['Tipo',ACT_TYPES[a.tipo]||''],['Estado',ACT_ESTADOS[a.estado||'idea']],['Fecha',a.desde?flong(a.desde)+(a.hasta&&a.hasta!==a.desde?' al '+flong(a.hasta):''):''],['Hora',tm(a.hora)],['Lugar',a.lugar||''],['Corregimiento',corrLabel(a.corrId)],['Meta de asistencia',a.metaAsistencia??'']]);
  if(a.objetivo)P.h('Objetivo').p(a.objetivo);
  if((a.roles||[]).length)P.h('Roles y responsables').table(['Rol','Responsable','Teléfono'],a.roles.map(r=>[r.rol,roleWho(r)||'-',(S.personas[r.personaId]||{}).telefono||'']),[40,35,20]);
  if((a.participantes||[]).length)P.h('Quiénes más van').bullets(a.participantes.map(x=>whoName(x)+(x.confirmado?' (confirmado)':'')));
  if((a.momentos||[]).length)P.h('Momentos del evento').table(['#','Momento','Hora','Responsable','Qué se necesita'],a.momentos.map((m,i)=>{const r=(a.roles||[]).find(x=>x.id===m.rolId);return [String(i+1),m.nombre,m.hora||'',r?r.rol:'',m.necesita||'']}),[5,28,14,24,34]);
  const it=(a.itinerario||[]).slice().sort((x,y)=>(x.hora||'').localeCompare(y.hora||''));
  if(it.length)P.h('Itinerario').table(['Hora','Actor','Acción','Detalle'],it.map(s=>{const r=(a.roles||[]).find(x=>x.id===s.rolId);return [tm(s.hora)||'-',r?r.rol+(roleWho(r)?' ('+roleWho(r)+')':''):'Todos',s.accion||'',s.detalle||'']}),[12,28,32,28]);
  if((a.materiales||[]).length){const b=budgetOf(a);P.h('Materiales y presupuesto').table(['Material','Cantidad','Costo unit.','Fuente','Responsable','Subtotal','Listo'],budgetRows(a),[26,16,13,13,17,14,8],['Total','','','','',money(b.total),'']);P.kv([['Hay que comprar',money(b.compra)],['Aportes y préstamos',money(b.aporte)],['Costo por asistente',b.n?money(b.porPersona):'-']])}
  const ts=tasksOf('actividad',a.id);if(ts.length)P.h('Tareas').table(['Tarea','Responsable','Fecha','Estado'],ts.map(t=>[t.titulo,pname(t.responsableId)||'-',t.fecha?fdate(t.fecha):'-',ESTADOS[t.estado]]),[45,22,15,13]);
  const reus=actReuniones(a);if(reus.length){P.h('Lo que se habló en reuniones');reus.forEach(({r,t})=>{P.p(`${fdate(r.fecha)} · ${r.titulo||'Reunión'}`,{bold:true,gap:.5});P.p(t.notas||'Sin notas',{indent:5,muted:!t.notas})})}
  if((a.ideas||[]).length)P.h('Ideas').bullets(a.ideas.map(i=>i.texto+(i.autor?` (${i.autor})`:'')));
  const ev=a.evaluacion||{};if(ev.asistencia!=null||ev.logros)P.h('Evaluación').kv([['Asistencia real',ev.asistencia??''],['Jóvenes nuevos',ev.nuevos??''],['Logros',ev.logros||''],['Qué mejorar',ev.mejorar||'']]);return P}
function budgetPdf(a){const b=budgetOf(a);const P=PDF('Presupuesto',`${a.nombre||''} · ${a.desde?flong(a.desde):''}`);P.kv([['Actividad',a.nombre||''],['Meta de asistencia',b.n?String(b.n):'Sin definir']]);
  P.table(['Material','Cantidad','Costo unit.','Fuente','Responsable','Subtotal','Listo'],budgetRows(a),[26,16,13,13,17,14,8],['Total','','','','',money(b.total),'']);
  P.kv([['Hay que comprar',money(b.compra)],['Aportes y préstamos',money(b.aporte)],['Costo por asistente',b.n?money(b.porPersona):'-']]);return P}
function horPdf(h){const P=PDF('Horario',h.nombre);P.table(['',...h.cols],h.rows.map((r,ri)=>[r,...h.cols.map((c,ci)=>((h.celdas||{})[ri+'-'+ci]||[]).join(', '))]),[14,...h.cols.map(()=>Math.max(10,86/h.cols.length))]);if(h.notas)P.h('Notas').p(h.notas);return P}
function reportPdf(m){const [y,mo]=m.split('-').map(Number);const s=`${m}-01`,e=iso(new Date(y,mo,0));const inM=d=>d&&d>=s&&d<=e;
  const P=PDF('Reporte mensual',`UNE Juventud · ${cap(MESES[mo-1])} ${y}`);const ts=L('tareas');
  const done=ts.filter(t=>t.estado==='hecha'&&inM(t.hechaEl||t.fecha)),late=ts.filter(isLate);
  const acts=L('actividades').filter(a=>inM(a.desde)),reus=L('reuniones').filter(r=>inM(r.fecha)),vis=L('visitas').filter(v=>v.estado==='realizada'&&inM(v.fecha));
  P.h('Resumen').kv([['Tareas cumplidas',String(done.length)],['Vencidas hoy',String(late.length)],['Actividades',String(acts.length)],['Reuniones',String(reus.length)],['Visitas realizadas',String(vis.length)],['Jóvenes en actividades',String(acts.reduce((a,x)=>a+(+((x.evaluacion||{}).asistencia)||0),0))],['Jóvenes nuevos',String(acts.reduce((a,x)=>a+(+((x.evaluacion||{}).nuevos)||0),0))]]);
  const ms=L('metas');if(ms.length)P.h('Metas').table(['Indicador','Actual','Meta','Avance'],ms.map(x=>[x.nombre,String(x.actual||0),x.meta?String(x.meta):'-',x.meta?Math.round((x.actual||0)/x.meta*100)+'%':'-']),[40,15,15,12]);
  if(acts.length)P.h('Actividades').table(['Fecha','Actividad','Lugar','Asistencia','Gasto'],acts.sort((a,b)=>a.desde.localeCompare(b.desde)).map(a=>[fdate(a.desde),a.nombre||'',corrName(a.corrId)||a.lugar||'',String((a.evaluacion||{}).asistencia??'-'),money(budgetOf(a).compra)]),[12,36,24,12,14]);
  if(vis.length){const byP={};vis.forEach(v=>{const p=(GEOI.get(v.corrId)||{}).p||'Sin dato';byP[p]=(byP[p]||0)+1});P.h('Visitas por provincia').bullets(Object.entries(byP).map(([p,n])=>`${p}: ${n}`))}
  const byR={};done.forEach(t=>{const n=pname(t.responsableId)||'Sin asignar';byR[n]=(byR[n]||0)+1});if(done.length)P.h('Cumplimiento por responsable').table(['Responsable','Cumplidas'],Object.entries(byR).map(([n,v])=>[n,String(v)]),[60,20]);
  if(late.length)P.h('Pendientes atrasados').bullets(late.sort(sortTasks).map(t=>`${t.titulo} · ${pname(t.responsableId)||'sin responsable'} · desde ${fdate(t.fecha)}`));
  if(reus.length)P.h('Reuniones').bullets(reus.map(r=>`${fdate(r.fecha)}: ${r.titulo||'Reunión'}${r.minuta?' · '+r.minuta.resumen:''}`));return P}
const csv=(head,rows)=>'﻿'+[head,...rows].map(r=>r.map(c=>{const s=String(c??'');return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
async function doBackup(){if(!window.JSZip){toast('La compresión no cargó; recarga la página');return}toast('Preparando la copia…');
  const z=new JSZip(),T=today();z.file(`datos/UNE-datos-${T}.json`,JSON.stringify({app:'Centro de Mando UNE Juventud',proyecto:PROYECTO,version:SCHEMA_VERSION,fecha:new Date().toISOString(),datos:S},null,1));
  L('reuniones').filter(r=>r.estado==='terminada').forEach(r=>z.file(`minutas/Minuta-${r.fecha||'sin-fecha'}-${slug(r.titulo)}-${r.id.slice(-4)}.pdf`,minutaPdf(r).blob()));
  L('actividades').forEach(a=>{z.file(`actividades/Ficha-${a.desde||'sin-fecha'}-${slug(a.nombre)}-${a.id.slice(-4)}.pdf`,actPdf(a).blob());if((a.materiales||[]).length)z.file(`presupuestos/Presupuesto-${slug(a.nombre)}-${a.id.slice(-4)}.pdf`,budgetPdf(a).blob())});
  L('horarios').forEach(h=>z.file(`horarios/Horario-${slug(h.nombre)}-${h.id.slice(-4)}.pdf`,horPdf(h).blob()));
  z.file(`reportes/Reporte-${T.slice(0,7)}.pdf`,reportPdf(T.slice(0,7)).blob());
  z.file('tablas/tareas.csv',csv(['Título','Responsable','Fecha','Hora','Prioridad','Estado','Tipo','Origen','Corregimiento','Notas'],L('tareas').sort(sortTasks).map(t=>[t.titulo,pname(t.responsableId),t.fecha,t.hora,PRIOS[t.prioridad],ESTADOS[t.estado],t.tipo,originLabel(t)||ORIG[(t.origen||{}).tipo]||'',corrName(t.corrId),t.notas])));
  z.file('tablas/personas.csv',csv(['Nombre','Grupo','Teléfono','Provincia','Habilidades','Último contacto','Notas'],L('personas').map(p=>[p.nombre,{c0:'Círculo 0',lider:'Líder territorial',aliado:'Aliado'}[p.grupo||'c0'],p.telefono,p.provincia,(p.habilidades||[]).join(' / '),p.ultimoContacto,p.notas])));
  z.file('tablas/visitas.csv',csv(['Fecha','Corregimiento','Distrito','Provincia','Circuito','Responsable','Estado','Objetivo','Jóvenes'],L('visitas').map(v=>{const g=GEOI.get(v.corrId)||{};return [v.fecha,g.c,g.d,g.p,g.circ,pname(v.responsableId),v.estado,v.objetivo,v.jovenes]})));
  z.file('tablas/lideres.csv',csv(['Circuito','Corregimiento','Líder','Teléfono'],L('circuitos').flatMap(c=>Object.entries(c.lideres||{}).map(([cid,pid])=>[c.codigo,corrName(cid),pname(pid),(S.personas[pid]||{}).telefono||'']))));
  z.file('LEEME.txt',`Copia de seguridad del Centro de Mando UNE Juventud\nFecha: ${flong(T)}\n\n- datos/: todo en JSON. Súbelo en Respaldo > Restaurar.\n- minutas/, actividades/, presupuestos/, horarios/, reportes/: los PDF.\n- tablas/: CSV para Excel.\n`);
  const blob=await z.generateAsync({type:'blob'});if(await saveFile(`Respaldo-UNE-Juventud-${T}.zip`,blob)){const g=S.config.general||{id:'general'};g.ultimoRespaldo=new Date().toISOString();put('config',g,0);toast('Copia descargada');render()}}
async function readRestore(file){try{let txt;if(/\.zip$/i.test(file.name)){const z=await JSZip.loadAsync(file);const f=Object.values(z.files).find(x=>/^datos\/.*\.json$/.test(x.name));if(!f)throw 0;txt=await f.async('string')}else txt=await file.text();
  const o=JSON.parse(txt);const d=o.datos||o;const counts={};COLS.forEach(c=>{if(d[c])counts[c]=Object.keys(d[c]).length});if(!Object.keys(counts).length)throw 0;
  UI.restore={fecha:o.fecha?flong(o.fecha.slice(0,10)):'',data:d,counts};render()}catch(e){toast('Ese archivo no es una copia válida del centro de mando')}}
async function doRestore(){const d=UI.restore.data;COLS.forEach(c=>{if(c==='config')return;Object.keys(S[c]).forEach(id=>{if(!d[c]||!d[c][id])del(c,id)});Object.values(d[c]||{}).forEach(o=>put(c,o,50))});UI.restore=null;toast('Datos restaurados');render()}
