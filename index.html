<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centro de Mando UNE Juventud</title>
<meta name="theme-color" content="#071a3d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Centro de Mando">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
/* Layout: riel de navegación azul noche a la izquierda + lienzo claro; bandas diagonales y rieles de línea de tiempo en vez de cajas iguales. En teléfono el riel pasa a barra superior deslizable. */
:root{
  color-scheme:light;
  --bg:#f2f5fb; --surface:#ffffff; --ink:#0b1f3a; --muted:#5a6b85; --line:#dbe3f0; --soft:#eaf0fa;
  --night:#071a3d; --navy:#0b2a5c; --blue:#1e5eff; --cyan:#00cfe0; --cyan-ink:#00303a; --pop:#ff4f6d; --sun:#ffc53d;
  --ok:#0f9b67; --warn:#c77800; --bad:#e0384f;
  --k-tarea:#1e5eff; --k-seg:#c77800; --k-act:#7a4fe0; --k-reu:#00a3b8; --k-vis:#0f9b67; --k-serie:#e0457b; --k-fer:#8a96a8;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3vw,38px);letter-spacing:-.02em;line-height:1.05;color:var(--navy)}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(17px,1.7vw,21px);letter-spacing:-.01em;color:var(--navy)}
h3{font-family:var(--f-body);font-weight:800;font-size:16px;color:var(--navy)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.muted{color:var(--muted)} .small{font-size:13.5px}

/* Estructura */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--night);color:#cfe0ff;padding:18px 12px 18px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow:auto;
  background-image:radial-gradient(120% 40% at 0% 0%,#123a80 0%,transparent 60%),linear-gradient(160deg,transparent 70%,rgba(0,207,224,.12) 100%)}
.rail .logo{background:#fff;border-radius:16px;padding:8px 10px;display:flex;justify-content:center}
.rail .logo img{height:54px;width:auto}
.nav{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp>span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#7f9bd0;font-weight:800;padding:2px 10px}
.nav a{display:flex;align-items:center;gap:10px;text-decoration:none;color:#dfe9ff;padding:8px 10px;border-radius:12px;font-weight:700;position:relative}
.nav a svg{width:18px;height:18px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current="page"]{background:linear-gradient(90deg,var(--blue),#3b7bff);color:#fff;box-shadow:0 6px 18px rgba(30,94,255,.35)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--cyan)}
.nav a .b{margin-left:auto;font-size:11.5px;background:var(--pop);color:#fff;border-radius:999px;padding:0 7px;line-height:18px;font-weight:800}
.sync{margin-top:auto;font-size:12.5px;color:#9db4e0;padding:8px 10px;display:flex;gap:7px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:#7f9bd0;display:inline-block}
.sync.ok i{background:#2ee59d} .sync.err i{background:var(--pop)} .sync.local i{background:var(--sun)}
main{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:22px 90px;min-width:0}
.view{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;z-index:15;flex-direction:row;align-items:center;padding:8px max(12px,env(safe-area-inset-left,0px));overflow-x:auto;gap:10px}
  .rail .logo{padding:4px 6px}.rail .logo img{height:32px}
  .grp>span,.sync{display:none}
  .nav{flex-direction:row;gap:2px}.grp{flex-direction:row}
  .nav a{white-space:nowrap;padding:7px 10px}
  .nav a[aria-current="page"]::before{display:none}
}

/* Encabezado de vista */
.vhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.vhead .t{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

/* Hero de inicio */
.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--night);color:#fff;padding:26px 28px 24px;
  background-image:linear-gradient(115deg,var(--night) 0 48%,var(--navy) 48% 70%,var(--blue) 70% 86%,var(--cyan) 86%)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:28px solid rgba(255,255,255,.08)}
.hero .hi{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr);gap:22px;align-items:end}
@media (max-width:900px){.hero{background-image:linear-gradient(160deg,var(--night) 0 60%,var(--navy) 60% 82%,var(--blue) 82%)}.hero .hi{grid-template-columns:1fr}}
.hero h1{color:#fff;font-size:clamp(26px,3.4vw,44px)}
.hero h1 em{font-style:normal;color:var(--cyan)}
.hero .date{color:#a9c3ff;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:0;text-align:left;background:rgba(255,255,255,.1);backdrop-filter:blur(4px);border-radius:16px;padding:12px 14px;color:#fff;display:flex;flex-direction:column;gap:2px}
.stat:hover{background:rgba(255,255,255,.18)}
.stat b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:700;letter-spacing:.04em;opacity:.85}
.stat.hot b{color:#ffd0d8} .stat.hot{background:rgba(255,79,109,.32)}

/* Controles */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:800;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink);line-height:1.25;font-size:14.5px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.acc{background:var(--cyan);border-color:var(--cyan);color:var(--cyan-ink)}
.btn.dark{background:var(--night);border-color:var(--night);color:#fff}
.btn.sm{padding:4px 11px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;flex-wrap:wrap;gap:2px}
.seg button{border:0;background:transparent;padding:5px 13px;font-weight:800;color:var(--muted);border-radius:999px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 4px rgba(11,31,58,.15)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>label,.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800}
.in,.f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:12px;padding:8px 11px;background:var(--surface);width:100%;min-width:0}
.f textarea,textarea.in{resize:vertical;min-height:80px;line-height:1.5}
.in:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(30,94,255,.15)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.title-in{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.3vw,28px);letter-spacing:-.02em;color:var(--navy);border:1.5px dashed transparent;background:transparent;border-radius:12px;padding:2px 8px;width:100%}
.title-in:hover,.title-in:focus{border-color:var(--line);background:var(--surface);outline:none}

/* Superficies (con roles distintos) */
.panel{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 1px 0 var(--line),0 8px 24px -18px rgba(11,31,58,.35)}
.panel>header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.flat{display:flex;flex-direction:column;gap:12px;min-width:0}
.flat>header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
.cols.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1050px){.cols,.cols.even,.cols.three{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(290px,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.empty{color:var(--muted);border:2px dashed var(--line);border-radius:16px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.note{background:linear-gradient(90deg,#e6fbfd,#eef3ff);border-radius:16px;padding:12px 14px;font-size:14px}
.note.warn{background:#fff4dc}
.note.pop{background:linear-gradient(90deg,#ffe3e8,#fff1f3)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 9px;font-size:12.5px;font-weight:800;white-space:nowrap}
.p-alta{background:#ffe1e6;color:#c4203a} .p-media{background:#fff0d1;color:#9a5c00} .p-baja{background:#e3ecff;color:var(--blue)}
.s-hecha{background:#d9f5e9;color:var(--ok)} .s-curso{background:#d9f7fa;color:#007b8a} .s-bloqueada{background:#ffe1e6;color:#c4203a} .s-pendiente{background:var(--soft);color:var(--muted)}
.pill.camp{background:var(--night);color:#fff}
.olink{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-weight:800;font-size:inherit;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:4px;align-items:center;background:var(--soft);border-radius:999px;padding:3px 4px 3px 4px;font-size:13.5px;font-weight:700}
.chip .av{width:24px;height:24px;font-size:10.5px}
.chip button{border:0;background:transparent;color:var(--muted);padding:0 6px;font-size:15px}
.chip.on{background:var(--blue);color:#fff}
.chip.on button{color:#cfe0ff}
.tag{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:800;color:var(--muted)}
.tag[aria-pressed="true"]{background:var(--night);border-color:var(--night);color:#fff}
.av{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex:none;font-family:var(--f-display)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;padding:2px 8px;line-height:1;border-radius:8px}
.x:hover{color:var(--bad);background:#ffe9ec}

/* Riel de tareas (timeline) */
.tlist{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 2px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--ok)}
.trow .tt{font-weight:800;overflow-wrap:anywhere;cursor:pointer}
.trow .tt:hover{color:var(--blue)}
.trow.done .tt{text-decoration:line-through;color:var(--muted)}
.trow .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--muted);margin-top:3px}
.trow .meta .late{color:var(--bad);font-weight:800}
.trow .acts{display:flex;gap:4px}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:1050px){.lanes{grid-template-columns:1fr}}
.lane{border-top:6px solid var(--c);border-radius:6px 6px 20px 20px}
.timeline{position:relative;display:flex;flex-direction:column;gap:2px;padding-left:22px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--blue),var(--cyan))}
.tl{position:relative;padding:6px 0 10px}
.tl::before{content:"";position:absolute;left:-21px;top:11px;width:13px;height:13px;border-radius:50%;background:var(--surface);border:3px solid var(--blue)}
.tl.today::before{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 4px rgba(0,207,224,.25)}
.tl .d{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.tl .d small{color:var(--muted);font-weight:700;margin-left:6px;letter-spacing:0;text-transform:none}

/* Lista maestra tipo boleto */
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.list .items{display:flex;flex-direction:column;gap:8px;padding:2px}
.item .body{display:flex;flex-direction:column;gap:3px;padding:11px 14px 12px}
.item .nm{font-size:16px;line-height:1.3;white-space:normal}
.item .desc{font-size:13.5px;color:var(--ink);opacity:.8;line-height:1.4;white-space:normal;overflow-wrap:anywhere}
.item.full{grid-template-columns:7px minmax(0,1fr)}
.item.full .band{background:var(--c,var(--blue))}
.item.full .body{padding:11px 14px 12px;display:flex;flex-direction:column;gap:3px}
.item.full .fd{font-weight:800;font-size:13.5px;color:var(--blue);line-height:1.3}
.item.full .nm{font-size:16px;line-height:1.3;white-space:normal}
.item{display:grid;grid-template-columns:86px minmax(0,1fr);text-align:left;border:0;background:var(--surface);border-radius:16px;overflow:hidden;padding:0;box-shadow:0 1px 0 var(--line)}
.item:hover{box-shadow:0 0 0 2px var(--soft),0 6px 16px -10px rgba(11,31,58,.4)}
.item[aria-current="true"]{box-shadow:0 0 0 2.5px var(--blue)}
.item.past{opacity:.6}
.item .stub{background:var(--c,var(--navy));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;position:relative;text-align:center;line-height:1.1}
.item .stub::after{content:"";position:absolute;right:-1px;top:6px;bottom:6px;border-right:3px dotted var(--bg)}
.item .stub small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;opacity:.9;white-space:nowrap}
.item .stub b{font-family:var(--f-display);font-weight:800;font-size:27px;line-height:1.05;white-space:nowrap}
.item .stub b.rg{font-size:21px}
.item .nm{font-size:15.5px}
.item .sub{font-size:13px}
.item .body{padding:10px 12px;min-width:0}
.item .nm{font-weight:800;overflow-wrap:anywhere;display:block}
.item .sub{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.add{display:flex;gap:6px;flex-wrap:wrap}
.add input{flex:1 1 140px}
.detail{display:flex;flex-direction:column;gap:16px;min-width:0}
.dhead{background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;box-shadow:0 1px 0 var(--line)}
.dhead::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:var(--c,var(--blue))}
.when{font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);padding-bottom:0}
.tabs button{border:0;background:transparent;padding:9px 13px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--navy);border-color:var(--blue)}
.tabs button .n{font-size:11px;background:var(--soft);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--muted)}
/* Planificador: lista de fechas que se abre en su sitio, con pasos numerados en vez de pestañas */
.alist{display:flex;flex-direction:column;gap:8px}
.mhead{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 4px 0}
.acard{background:var(--surface);border-radius:18px;box-shadow:0 1px 0 var(--line);overflow:hidden;scroll-margin-top:76px}
.acard>.item{width:100%;border-radius:0;box-shadow:none;grid-template-columns:86px minmax(0,1fr) 40px}
.acard>.item:hover{box-shadow:none;background:var(--soft)}
.acard>.item .chev{align-self:center;justify-self:center}
.acard.past:not(.open)>.item{opacity:.6}
.acard.open{box-shadow:0 0 0 2.5px var(--blue),0 18px 40px -24px rgba(11,31,58,.5)}
.chev{color:var(--muted);font-size:15px;font-weight:800}
.abody{background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--soft)}
.abody .closer{align-self:center}
.plan{display:flex;flex-direction:column;gap:10px;min-width:0}
.ptools{padding:0 4px}
.psec{background:var(--surface);border-radius:16px;box-shadow:0 1px 0 var(--line);min-width:0}
.ph{display:grid;grid-template-columns:30px minmax(0,1fr) 24px;gap:12px;align-items:center;width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:16px}
.ph:hover{background:var(--soft)}
.psec.open .ph{border-radius:16px 16px 0 0}
.pn{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--navy);display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:13px}
.psec.open .pn{background:var(--blue);color:#fff}
.pt{min-width:0;display:flex;flex-direction:column}
.pt b{font-size:15.5px;color:var(--navy);line-height:1.3}
.pt small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{padding:12px 14px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--soft);min-width:0}
.sub2{display:flex;flex-direction:column;gap:10px;border-top:2px dashed var(--line);padding-top:12px;margin-top:4px;min-width:0}
.roles,.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.rolec{background:var(--bg);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--line);min-width:0}
.rolec.ok{background:#e9f8f1;border-left-color:var(--ok)}
.rolec .rh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:center}
.rolec .rn{font-weight:800;color:var(--navy);border:1.5px dashed transparent;background:transparent;border-radius:8px;padding:2px 6px;width:100%;min-width:0}
.rolec .rn:hover,.rolec .rn:focus{border-color:var(--line);background:var(--surface);outline:none}
.rolec .rd{font-size:12.5px;color:var(--muted);line-height:1.35;padding:0 6px}
.rolec .btn{align-self:flex-start}

@media (max-width:560px){.acard>.item{grid-template-columns:70px minmax(0,1fr) 28px}.abody{padding:8px}.pb{padding:10px 10px 14px}.ph{padding:11px 10px;gap:9px}.mom{grid-template-columns:64px minmax(0,1fr)}.momx{grid-column:1/-1;flex-direction:row;justify-content:flex-end}}
/* Tareas por prioridad, banco de ideas en tarjetas, día desplegado en la agenda y listas de personas */

.gbody{background:var(--surface);padding:4px 14px 12px;border-top:2px solid var(--soft);display:flex;flex-direction:column;gap:12px;min-width:0}
.trow .tdesc{display:none;font-size:13.5px;color:var(--ink);opacity:.8;line-height:1.4;margin-top:2px;overflow-wrap:anywhere}
@media (hover:none){.trow .tdesc{display:block}}
.trow .x.del{font-size:15px;opacity:.55}
.trow .x.del:hover{opacity:1;background:#ffe3e8}
.ctip{white-space:pre-line}
.ideagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.idea{background:var(--ic,#f2edff);border-radius:16px 16px 16px 4px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.idea .tx{font-weight:800;color:var(--navy);line-height:1.35;overflow-wrap:anywhere}
.idea .by{font-size:12.5px;color:var(--muted)}
.idea .go{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:auto;padding-top:6px}

.idea .btn.sm{background:#ffffffc0}
.cal .day{cursor:pointer}
.cal .day:hover{background:var(--soft)}
.cal .day.sel,.cal .day.sel:hover{background:#e3ecff;box-shadow:inset 0 0 0 2.5px var(--blue)}
.daybox{grid-column:1/-1;background:var(--bg);border-top:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.daybox h3{margin:0;font-size:17px;color:var(--navy)}
.daybox .evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.plist{padding:6px 14px;gap:0}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pn2{border:0;background:none;padding:0;text-align:left;font-weight:800;color:var(--navy);overflow-wrap:anywhere}
.prow .pn2:hover{color:var(--blue);text-decoration:underline}
.prow select{width:auto;padding:5px 8px;font-size:13.5px;font-weight:700}
.impprev{display:flex;flex-direction:column;gap:10px}
.impprev table{border-collapse:collapse;width:100%;font-size:13.5px}
.impprev td,.impprev th{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
.impprev .f select{padding:5px 8px;font-size:13.5px}
@media (max-width:560px){.gbody{padding:4px 8px 10px}.prow{grid-template-columns:30px minmax(0,1fr)}.prow select{grid-column:2}.daybox{padding:10px 8px}}

/* Tablas editables */
.tscroll{overflow-x:auto}
table.ed{border-collapse:collapse;width:100%;min-width:600px}
.ed th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);text-align:left;padding:7px 6px;border-bottom:2px solid var(--ink)}
.ed td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.ed tfoot td{border-bottom:0;font-weight:800;padding:8px 6px}
.ed input,.ed select{width:100%;border:1.5px solid transparent;background:transparent;border-radius:8px;padding:6px}
.ed input:hover,.ed input:focus,.ed select:hover,.ed select:focus{border-color:var(--line);background:var(--bg);outline:none}
.ed input.need:placeholder-shown{background:#e6fbfd}
.ed input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
.ed .r{text-align:right}

/* Ideas */
.ideas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ideas li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;background:#f2edff;border-radius:14px 14px 14px 4px;padding:9px 11px}
.ideas li .by{display:block;font-size:12.5px;color:var(--muted)}
.ideabtn{background:var(--k-act);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-family:var(--f-display);font-size:13px}

/* Momentos e itinerario */
.moments{display:flex;flex-direction:column;gap:0;position:relative;padding-left:24px}
.moments::before{content:"";position:absolute;left:9px;top:12px;bottom:12px;width:3px;background:var(--soft);border-radius:3px}
.mom{position:relative;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0}
.mom::before{content:attr(data-n);position:absolute;left:-24px;top:12px;width:21px;height:21px;border-radius:50%;background:var(--k-act);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;font-family:var(--f-display)}
.mom input,.mom select,.mom textarea{border:1.5px solid transparent;background:transparent;border-radius:8px;padding:5px 7px;width:100%}
.mom input:hover,.mom input:focus,.mom select:hover,.mom textarea:hover,.mom textarea:focus{border-color:var(--line);background:var(--surface);outline:none}
.mom .nm{font-weight:800;font-size:15px}
.mom textarea{min-height:34px;resize:vertical;font-size:13.5px;color:var(--muted)}
.actors{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.actor{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,var(--soft),var(--surface) 70%)}
.actor ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.actor b.h{font-variant-numeric:tabular-nums;color:var(--blue)}
.budget{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end}
.budget div b{font-family:var(--f-display);font-size:26px;color:var(--navy);display:block;line-height:1.1}
.budget div span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}

/* Agenda */
.cal{display:grid;grid-template-columns:44px repeat(7,minmax(0,1fr));border-radius:20px;overflow:hidden;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.cal .hd{background:var(--night);color:#fff;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.1em;padding:9px;text-align:center}
.cal .wk{border:0;border-top:1px solid var(--line);background:var(--soft);font-size:11.5px;font-weight:800;color:var(--muted);display:flex;align-items:flex-start;justify-content:center;padding-top:9px}
.cal .wk:hover{background:#d9f7fa;color:var(--navy)}
.cal .day{border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:112px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day.out{background:#f8fafd}.cal .day.out .dn{opacity:.4}
.cal .day.today .dn{background:var(--blue);color:#fff}
.cal .dn{border:0;background:transparent;font-weight:800;font-family:var(--f-display);font-size:13px;align-self:flex-start;min-width:26px;height:26px;border-radius:999px;color:var(--navy)}
.cal .dn:hover{background:var(--soft)}
.cal .fer{font-size:10.5px;color:var(--k-fer);font-weight:800;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 11%,white);border-radius:5px;padding:1px 5px;font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ev.lnk{text-decoration:underline;text-underline-offset:2px}
.ev.done{opacity:.55;text-decoration:line-through}
.more{font-size:11.5px;color:var(--muted);border:0;background:transparent;text-align:left;padding:0 4px;font-weight:700}
@media (max-width:700px){.cal{grid-template-columns:26px repeat(7,minmax(0,1fr))}.cal .day{min-height:60px;padding:2px}.ev{font-size:0;height:6px;padding:0}.cal .fer{display:none}}
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.wcol{background:var(--surface);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:220px;box-shadow:0 1px 0 var(--line)}
.wcol.today{box-shadow:0 0 0 2.5px var(--cyan)}
.wcol h4{display:flex;justify-content:space-between;font-family:var(--f-display);font-size:13px;color:var(--navy)}
.wev{text-align:left;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 10%,white);border-radius:8px;padding:6px 8px;font-size:13.5px;display:flex;flex-direction:column;gap:1px;color:var(--ink);width:100%}
.wev b{font-weight:800}
.wev .tm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wev.lnk b{text-decoration:underline;text-underline-offset:2px}
.wev.done{opacity:.55}
.dayv{display:grid;grid-template-columns:64px minmax(0,1fr);border-radius:20px;background:var(--surface);overflow:hidden;box-shadow:0 1px 0 var(--line)}
.dayv .h{font-size:12.5px;color:var(--muted);text-align:right;padding:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.dayv .s{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:5px;display:flex;flex-wrap:wrap;gap:6px;min-height:46px}
.dayv .s .wev{flex:1 1 220px;width:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:4px;vertical-align:-1px}

/* Series de reuniones */
.series{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px}
.serie{flex:0 0 250px;border-radius:20px;padding:14px;color:#fff;background:var(--sc,var(--navy));display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}

.serie .row{position:relative;z-index:1}
.serie .btn{background:rgba(255,255,255,.95);border-color:transparent;color:var(--navy)}

/* Reunión en vivo */
.live{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:18px;align-items:start}

.topic{border-radius:16px;background:var(--bg);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.topic.ok{background:#e9f8f1}
.topic .th{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center}
.topic .th input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok)}
.topic .th b{font-weight:800;overflow-wrap:anywhere}
.topic textarea{border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--surface);width:100%;min-height:60px;resize:vertical;font-size:14px}
.topic .link{font-size:12.5px}

/* Horarios plegables */
.htypes{display:flex;flex-direction:column;gap:10px}
.htype{background:var(--surface);border-radius:18px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.htype>button{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left}
.htype>button .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--blue);font-family:var(--f-display);font-weight:800}
.htype>button b{font-weight:800;font-size:15.5px;display:block}
.htype>button small{color:var(--muted)}
.htype>button .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.htype[data-open="1"]>button .chev{transform:rotate(90deg)}
.htype .in-list{padding:0 16px 14px;display:flex;flex-direction:column;gap:6px}
.hlink{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:var(--bg);border-radius:12px;padding:9px 12px;text-align:left;font-weight:700}

table.hor{border-collapse:collapse;width:100%;table-layout:fixed;min-width:620px;font-size:13px}
.hor th,.hor td{border:1px solid var(--line);vertical-align:top}
.hor thead th{background:var(--night);color:#fff;padding:2px}
.hor thead th input{background:transparent;border:1px dashed transparent;color:#fff;font-weight:800;text-align:center;width:100%;padding:3px 2px;border-radius:6px;font-size:12.5px}
.hor th.slot{width:116px;background:var(--soft);padding:2px;vertical-align:middle}
.hor th.slot input{border:1px dashed transparent;background:transparent;width:100%;font-size:12px;text-align:right;padding:2px 4px;border-radius:6px;font-variant-numeric:tabular-nums}
.hor td{height:40px;padding:3px;cursor:pointer;position:relative;background:var(--surface)}
.hor .chips{gap:3px}
.hor td.e{background:#f4fdfe}
.hor td.e::after{content:"+";position:absolute;right:8px;bottom:4px;color:var(--muted)}
.hor td:hover{outline:2px solid var(--blue);outline-offset:-2px}
.hor .chip{font-size:11.5px;background:var(--blue);color:#fff;padding:1px 2px 1px 8px;line-height:1.3}
.hor .chip button{padding:0 4px;font-size:13px}
.hor .chip button{color:#d6e3ff}

/* Mapa */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:18px;align-items:start}
@media (max-width:1150px){.mapwrap{grid-template-columns:1fr}}
.mapbox{position:relative;background:linear-gradient(180deg,#e7f1fb,#d8e9f7);border-radius:24px;overflow:hidden;height:min(74vh,660px);touch-action:none}
.mapbox canvas{display:block;width:100%;height:100%;cursor:grab}
.mapbox canvas.drag{cursor:grabbing}
.mapctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:12px;border:0;background:#fff;font-weight:800;font-size:18px;box-shadow:0 2px 8px rgba(11,31,58,.15)}
.mapcrumb{position:absolute;left:12px;top:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 70px)}
.mapcrumb .btn{box-shadow:0 2px 8px rgba(11,31,58,.15)}
.maplegend{position:absolute;left:12px;bottom:12px;background:#ffffffee;border-radius:12px;padding:7px 11px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:calc(100% - 24px);font-weight:700}
.maplegend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-2px}
.tip{position:absolute;pointer-events:none;background:var(--night);color:#fff;font-size:12.5px;padding:5px 9px;border-radius:8px;white-space:nowrap;transform:translate(12px,12px);font-weight:700;z-index:5}
.cpanel{display:flex;flex-direction:column;gap:14px}
.bignum{display:flex;gap:18px;flex-wrap:wrap}
.bignum div b{font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--navy);display:block;line-height:1.1}
.bignum div span{font-size:11.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.foda{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foda>div{border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.foda b{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.foda .F{background:#dcf6ea} .foda .F b{color:var(--ok)}
.foda .D{background:#fff1d6} .foda .D b{color:#9a5c00}
.foda .O{background:#dcf8fb} .foda .O b{color:#00788a}
.foda .A{background:#ffe3e8} .foda .A b{color:#c4203a}

.foda details summary{font-size:12px;color:var(--muted);cursor:pointer;font-weight:700}

.src{font-size:11px;color:var(--muted);font-weight:700}
.pestel{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.news li{border-left:3px solid var(--cyan);padding-left:9px;font-size:13.5px}
.news li small{display:block;color:var(--muted)}
.alert{background:#ffe3e8;color:#a3122b;border-radius:12px;padding:8px 11px;font-weight:800;font-size:13.5px}

/* Cobertura */
table.heat{border-collapse:separate;border-spacing:3px;width:100%;min-width:780px}
.heat th{font-size:10.5px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;text-align:center;white-space:nowrap}
.heat th.n{text-align:left;font-size:13.5px;color:var(--ink);text-transform:none;letter-spacing:0;white-space:normal;min-width:170px}

.heat td{height:26px;border-radius:6px;text-align:center;font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)}
.heat td.last{background:transparent;text-align:left;font-weight:600;color:var(--muted);white-space:nowrap;padding-left:8px}

/* Panel de datos */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:0 1px 0 var(--line)}
.kpi b{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi.bad b{color:var(--bad)}
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--f-body);fill:var(--muted);font-size:11px;font-weight:700}
.chart .lab{fill:var(--ink);font-weight:800}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart [data-tip]{cursor:default}
.chart [data-tip]:hover{opacity:.82}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}

.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

.goal .big{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--navy);line-height:1}

.ctip{position:fixed;z-index:70;pointer-events:none;background:var(--night);color:#fff;font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:10px;max-width:260px}

.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:var(--surface);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 0 var(--line)}
.pcard .nmr{display:flex;gap:10px;align-items:center}
.pcard input.nm{font-weight:800;font-size:16px;border:1.5px dashed transparent;background:transparent;border-radius:8px;padding:2px 4px;width:100%}
.pcard input.nm:hover,.pcard input.nm:focus{border-color:var(--line);outline:none}
.pcard .tag{font-size:12px;padding:2px 9px}
.prov{background:var(--surface);border-radius:20px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.prov>button{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:13px 16px;text-align:left}
.prov>button b{font-family:var(--f-display);font-size:15px;color:var(--navy)}
.prov>button .chev{margin-left:auto;color:var(--muted)}
.prov .circs{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.circ{border-radius:16px;background:var(--bg);overflow:hidden}
.circ>button{width:100%;border:0;background:transparent;display:grid;grid-template-columns:70px minmax(0,1fr) 120px auto;gap:10px;align-items:center;padding:10px 12px;text-align:left}
.circ>button .code{font-family:var(--f-display);font-weight:800;color:#fff;background:var(--navy);border-radius:10px;text-align:center;padding:4px 0;font-size:14px}
.circ .cov{height:8px;background:#fff;border-radius:4px;overflow:hidden}.circ .cov i{display:block;height:100%;background:var(--cyan)}
.circ .tbody{padding:0 10px 10px}
@media (max-width:600px){.circ>button{grid-template-columns:56px minmax(0,1fr) auto}.circ>button .covw{display:none}}

/* Drawer, modal, FAB */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(860px,100%);background:var(--bg);z-index:45;box-shadow:-20px 0 50px rgba(7,26,61,.25);display:flex;flex-direction:column;
  padding:max(14px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px 16px;overflow:auto}
.drawer .dbar{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--bg);padding:6px 0 10px;z-index:2}
.scrim{position:fixed;inset:0;background:rgba(7,26,61,.35);z-index:44}
.modal{position:fixed;inset:0;background:rgba(7,26,61,.5);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal .box{background:var(--surface);border-radius:24px;width:min(640px,100%);padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px rgba(7,26,61,.35)}
.modal .box header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.modal .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#ffe3e8;border-radius:12px;padding:8px 10px;font-size:14px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff;font-size:30px;font-weight:800;box-shadow:0 12px 26px rgba(30,94,255,.45);display:grid;place-items:center}
.fab:hover{transform:translateY(-2px)}
.fabmenu{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:41;background:var(--surface);border-radius:20px;padding:8px;box-shadow:0 20px 40px rgba(7,26,61,.3);display:flex;flex-direction:column;min-width:210px}
.fabmenu button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:12px;font-weight:800;display:flex;gap:10px;align-items:center}
.fabmenu button:hover{background:var(--soft)}
.fabmenu button i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;z-index:80;max-width:calc(100% - 32px);text-align:center}
.msg{width:100%;min-height:170px;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);font-size:15px;line-height:1.5}
details>summary{cursor:pointer;font-weight:800;color:var(--navy)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

#sbLogin .sbl-card{background:#fff;color:#0b1f3a;border-radius:18px;padding:28px 24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}

<script>/* Centro de Mando UNE Juventud · conexión con Supabase (proyecto une-juventud) */
(function(){
const URL='https://yjfibsttpaqyodoxcgqr.supabase.co', KEY='sb_publishable_EC1uLruwQdn0a8afWe0dsA_2MQ8yuv8';
const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
window.SB=sb;
function mkDB(){
  const subs={};const maps={};
  const snap=(c)=>({docs:Object.entries(maps[c]).map(([id,data])=>({id,data:()=>data})),metadata:{fromCache:false}});
  const emit=c=>(subs[c]||[]).forEach(f=>{try{f.ok(snap(c))}catch(e){console.error(e)}});
  const et={};const emitSoon=c=>{if(et[c])return;et[c]=setTimeout(()=>{et[c]=0;emit(c)},60)};
  let chan=null;
  function ensureChan(){if(chan)return;
    chan=sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      const r=p.eventType==='DELETE'?p.old:p.new;const c=r&&r.col;if(!c||!maps[c])return;
      if(p.eventType==='DELETE'){if(r.id)delete maps[c][r.id]}else maps[c][r.id]=r.data;emitSoon(c)}).subscribe();}
  async function load(c){let all=[],from=0;for(;;){const {data,error}=await sb.from('docs').select('id,data').eq('col',c).range(from,from+999);if(error)throw error;all=all.concat(data);if(data.length<1000)break;from+=1000}
    maps[c]={};all.forEach(r=>maps[c][r.id]=r.data);emit(c)}
  return {
    async setMany(c,list){const {error}=await sb.from('docs').upsert(list.map(o=>({col:c,id:o.id,data:o})));if(error)throw error;if(maps[c])list.forEach(o=>maps[c][o.id]=o)},
    collection(c){return {onSnapshot(ok,err){(subs[c]=subs[c]||[]).push({ok,err});ensureChan();if(!maps[c]){maps[c]={};load(c).catch(e=>err&&err(e))}else ok(snap(c));return ()=>{}}}},
    doc(k){const i=k.indexOf('/'),c=k.slice(0,i),id=k.slice(i+1);return {
      async set(o){const {error}=await sb.from('docs').upsert({col:c,id,data:o});if(error)throw error;if(maps[c])maps[c][id]=o},
      async delete(){const {error}=await sb.from('docs').delete().eq('col',c).eq('id',id);if(error)throw error;if(maps[c])delete maps[c][id]}}}
  };
}
const DLX={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const u=URL_.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL_.revokeObjectURL(u);a.remove()},1500)}};
const URL_=window.URL;
function loginUI(msg){
  let el=document.getElementById('sbLogin');
  if(!el){el=document.createElement('div');el.id='sbLogin';document.body.appendChild(el)}
  el.innerHTML=`<div class="sbl-card"><div class="sbl-k">UNE Juventud</div><h1>Centro de Mando</h1>
  <p>Entra con tu correo. Te llega un enlace (y un código) para abrir la app en este dispositivo.</p>
  <form id="sblF"><label>Correo<input id="sblE" type="email" required value="${(()=>{try{return localStorage.getItem('cm-une-mail')||''}catch(e){return ''}})()}" autocomplete="email" placeholder="tu correo"></label>
  <button type="submit">Enviarme el acceso</button></form>
  <form id="sblC" hidden><label>Código del correo<input id="sblT" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"></label><button type="submit">Entrar</button></form>
  <p class="sbl-m" id="sblM">${msg||''}</p></div>`;
  el.querySelector('#sblF').onsubmit=async e=>{e.preventDefault();const em=el.querySelector('#sblE').value.trim();try{localStorage.setItem('cm-une-mail',em)}catch(e){}const m=el.querySelector('#sblM');m.textContent='Enviando…';
    const {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:true}});

let resolveReady;const ready=new Promise(r=>resolveReady=r);

async function start(sess){const em=sess&&sess.user&&sess.user.email;
  if(!sess){loginUI();return}
  const chk=await sb.rpc('es_dueno');if(chk.error||chk.data!==true){loginUI('Este correo ('+em+') no tiene acceso. Entra con el correo autorizado.');await sb.auth.signOut();return}
  const el=document.getElementById('sbLogin');if(el)el.remove();
  resolveReady([mkDB(),DLX]);}
let started=false;
sb.auth.onAuthStateChange((ev,sess)=>{if(started&&ev!=='SIGNED_IN')return;if(sess){started=true;start(sess)}else if(ev==='INITIAL_SESSION'||ev==='SIGNED_OUT')start(null)});

const COLS=['personas','tareas','reuniones','series','actividades','horarios','visitas','territorio','analisis','metas','circuitos','ideas','config'];

const LKEY='cm-une-cache-v2';
let DB=null,DL=null,storeMode='cargando';
const pending=new Map(),writing=new Set(),loaded=new Set();
function loadCache(){try{const o=JSON.parse(localStorage.getItem(LKEY)||localStorage.getItem('cm-une-cache-v1')||'null');if(o)COLS.forEach(c=>{if(o[c])S[c]=o[c]})}catch(e){}}
let cacheT;function saveCache(){clearTimeout(cacheT);cacheT=setTimeout(()=>{try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}},600)}
function put(col,o,ms=700){o.proyecto=PROYECTO;o.actualizado=new Date().toISOString();if(!o.creado)o.creado=o.actualizado;S[col][o.id]=o;saveCache();if(DB)queue(col,o.id,ms)}
function del(col,id){delete S[col][id];saveCache();if(DB)queue(col,id,0)}
/* Guardado en bloque (importar una lista): un solo envío por cada 200 registros en vez de uno por persona */
async function putMany(col,list){const now=new Date().toISOString();list.forEach(o=>{o.proyecto=PROYECTO;o.actualizado=now;if(!o.creado)o.creado=now;S[col][o.id]=o});saveCache();if(!DB)return list.length;
  const ks=list.map(o=>col+'/'+o.id);ks.forEach(k=>writing.add(k));setSync('saving');let n=0;
  try{for(;n<list.length;n+=200)await DB.setMany(col,list.slice(n,n+200).map(clone));setSync('ok');return list.length}
  catch(e){list.slice(n).forEach(o=>delete S[col][o.id]);saveCache();setSync('err');return n}finally{ks.forEach(k=>writing.delete(k))}}
function queue(col,id,ms){const k=col+'/'+id;clearTimeout(pending.get(k));pending.set(k,setTimeout(()=>flush(col,id),ms))}
async function flush(col,id){const k=col+'/'+id;if(writing.has(k)){queue(col,id,400);return}
  pending.delete(k);writing.add(k);setSync('saving');
  try{const o=S[col][id];if(o)await DB.doc(k).set(clone(o));else await DB.doc(k).delete();setSync('ok')}
  catch(e){setSync('err');toast(e&&e.code==='quota_exceeded'?'La base de datos está llena: descarga un respaldo y borra registros viejos':'No se pudo guardar un cambio. Se reintentará.');if(e&&e.code==='unavailable')queue(col,id,2500)}
  finally{writing.delete(k)}}
function setSync(st){const el=$('#sync');el.className='sync '+(st==='saving'?'':st);
  el.querySelector('span').textContent=st==='ok'?'Guardado en la nube':st==='saving'?'Guardando…':st==='err'?'Error al guardar':st==='local'?'Solo en este navegador':'Conectando…'}
async function initStore(){
  loadCache();render();
  if(window.SBDB){setSync('');try{[DB,DL]=await window.SBDB.ready()}catch(e){DB=null}}
  if(!DB){storeMode='local';setSync('local');render();return}
  storeMode='db';setSync('');
  const timer=setTimeout(()=>{if(loaded.size<COLS.length)toast('La nube tarda en responder; lo que ves puede estar desactualizado')},10000);
  COLS.forEach(c=>{DB.collection(c).onSnapshot(snap=>{
      const next={};
      snap.docs.forEach(d=>{const k=c+'/'+d.id;next[d.id]=(pending.has(k)||writing.has(k))&&S[c][d.id]?S[c][d.id]:clone(d.data())});
      for(const id in S[c]){const k=c+'/'+id;if(!(id in next)&&(pending.has(k)||writing.has(k)))next[id]=S[c][id]}
      const changed=JSON.stringify(next)!==JSON.stringify(S[c]);
      if(changed)S[c]=next;
      if(!snap.metadata.fromCache)loaded.add(c);
      if(loaded.size===COLS.length){clearTimeout(timer);setSync('ok');ensureSchema();migrate()}
      if(changed){saveCache();requestRender()}
    },err=>{setSync('err');toast('Se perdió la conexión con la nube. Recarga la página.')})});
}

function serieOn(s,d){if(s.activa===false||s.dia==null||s.dia==='')return false;const dd=pd(d);if(s.desde&&d<s.desde)return false;
  if(s.frecuencia==='mensual'){const a=pd(s.desde||d);return dd.getDay()===+s.dia&&Math.ceil(dd.getDate()/7)===Math.ceil(a.getDate()/7)}
  if(dd.getDay()!==+s.dia)return false;
  if(s.frecuencia==='quincenal'){const w=Math.round(diffDays(monday(s.desde||d),monday(d))/7);return w%2===0}
  return true}
function nextOf(s,from=today()){for(let i=0;i<70;i++){const d=addDays(from,i);if(serieOn(s,d))return d}return ''}

  r={id:uid('r'),titulo:s.nombre,serieId:sid,fecha:d,hora:s.hora||'',horaFin:s.horaFin||'',tipo:s.tipo||'otra',estado:'programada',lugar:s.lugar||'',temas,asistentes:(s.participantes||[]).map(p=>({personaId:p,presente:false})),ideas:[],apuntes:'',prevId:prev?prev.id:''};
  put('reuniones',r,0);return r}

function itemsOn(d){const out=[];
  if(FERIADOS[d])out.push({k:'fer',t:FERIADOS[d]});

  L('actividades').forEach(a=>{if(a.desde&&a.desde<=d&&(a.hasta||a.desde)>=d&&a.estado!=='cancelada')out.push({k:'act',id:a.id,t:a.nombre||'Actividad',h:d===a.desde?a.hora:''})});
  L('reuniones').forEach(r=>{if(r.fecha===d)out.push({k:'reu',id:r.id,t:r.titulo||'Reunión',h:r.hora,done:r.estado==='terminada'})});
  L('visitas').forEach(v=>{if(v.fecha===d&&v.estado!=='cancelada')out.push({k:'vis',id:v.id,t:'Visita: '+(corrName(v.corrId)||'corregimiento'),h:v.hora,done:v.estado==='realizada'})});
  L('tareas').forEach(t=>{if(t.fecha===d&&!(t.tipo==='visita'&&L('visitas').some(v=>v.tareaId===t.id)))out.push({k:t.tipo==='seguimiento'?'seg':'tarea',id:t.id,t:t.titulo||'Tarea',h:t.hora,done:t.estado==='hecha',lnk:t.origen&&['reunion','actividad','visita'].includes(t.origen.tipo)&&t.origen.id})});
  if(d===today())L('personas').filter(p=>p.grupo==='lider'&&liderStatus(p).toca).forEach(p=>out.push({k:'lid',id:p.id,t:'Contactar a '+(p.nombre||'líder')}));
  return out.sort((a,b)=>(a.h||'99').localeCompare(b.h||'99'))}
