function dayBox(d){const its=itemsOn(d);const fer=its.find(x=>x.k==='fer');let ev=its.filter(x=>x.k!=='fer');const lids=ev.filter(x=>x.k==='lid');
  if(lids.length>3)ev=ev.filter(x=>x.k!=='lid').concat({k:'lid',id:'',t:`Contactar a ${lids.length} enlaces`});
  return `<div class="daybox" id="daybox"><div class="row between"><h3>${flong(d)}${fer?` <span class="muted small">· ${esc(fer.t)}</span>`:''}</h3><button class="x" data-a="calSel" data-d="${d}" aria-label="Cerrar el día">×</button></div>
   ${ev.length?`<div class="evs">${ev.map(x=>`<button class="wev ${x.lnk||x.k==='act'||x.k==='reu'||x.k==='serie'?'lnk':''} ${x.done?'done':''}" style="--c:${KC[x.k]}" data-a="openItem" data-k="${x.k}" data-id="${x.id}" data-d="${x.d||''}"><span class="tm">${KNAME[x.k]||''}${x.h?' · '+tm(x.h):''}${x.done?' · hecha':''}</span><b>${esc(x.t)}</b></button>`).join('')}</div>`:'<span class="muted small">No hay nada este día.</span>'}
   <div class="row"><button class="btn sm pri" data-a="newTask" data-d="${d}">+ Tarea</button><button class="btn sm" data-a="newTask" data-d="${d}" data-seg="1">+ Seguimiento</button><button class="btn sm" data-a="newVisit" data-d="${d}">+ Visita</button><button class="btn sm ghost" data-a="calDay" data-d="${d}">Ver el día por horas</button></div></div>`}
function vAgenda(){const c=UI.cal;const d0=pd(c.date);
  const title=c.mode==='mes'?`${cap(MESES[d0.getMonth()])} ${d0.getFullYear()}`:c.mode==='semana'?`Semana ${weekNo(c.date)}`:fshort(c.date);
  let body='';
  if(c.mode==='mes'){const first=iso(new Date(d0.getFullYear(),d0.getMonth(),1));let cur=monday(first);const m=d0.getMonth();
    body=`<div class="cal"><div class="hd">#</div>${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="hd">${x}</div>`).join('')}`;
    for(let w=0;w<6;w++){if(w>=4&&pd(cur).getMonth()!==m)break;
      body+=`<button class="wk" data-a="calWeek" data-d="${cur}" title="Ver semana ${weekNo(cur)}">${weekNo(cur)}</button>`;
      for(let i=0;i<7;i++){const dd=addDays(cur,i);const its=itemsOn(dd);const fer=its.find(x=>x.k==='fer');const ev=its.filter(x=>x.k!=='fer');
        body+=`<div class="day ${pd(dd).getMonth()!==m?'out':''} ${dd===today()?'today':''} ${dd===c.sel?'sel':''}" data-a="calSel" data-d="${dd}"><button class="dn" data-a="calSel" data-d="${dd}" aria-expanded="${dd===c.sel}" aria-label="Ver lo que hay el ${flong(dd)}">${pd(dd).getDate()}</button>${fer?`<span class="fer">${esc(fer.t)}</span>`:''}
         ${ev.slice(0,3).map(x=>`<button class="ev ${x.lnk?'lnk':''} ${x.done?'done':''}" style="--c:${KC[x.k]}" data-a="openItem" data-k="${x.k}" data-id="${x.id}" data-d="${x.d||''}" title="${esc(x.t)}">${x.h?tm(x.h).replace(':00','')+' ':''}${esc(x.t)}</button>`).join('')}
         ${ev.length>3?`<button class="more" data-a="calSel" data-d="${dd}">+${ev.length-3} más</button>`:''}</div>`}
      if(c.sel&&c.sel>=cur&&c.sel<=addDays(cur,6))body+=dayBox(c.sel);
      cur=addDays(cur,7)}
    body+='</div>'}
  else if(c.mode==='semana'){const m0=monday(c.date);body=`<div class="week">${[0,1,2,3,4,5,6].map(i=>{const dd=addDays(m0,i);const its=itemsOn(dd);
     return `<div class="wcol ${dd===today()?'today':''}"><h4><button class="olink" data-a="calDay" data-d="${dd}">${D3[pd(dd).getDay()]} ${pd(dd).getDate()}</button></h4>${its.map(x=>x.k==='fer'?`<span class="muted small">${esc(x.t)}</span>`:evBtn(x)).join('')||'<span class="muted small">Libre</span>'}</div>`}).join('')}</div>`}
  else{const its=itemsOn(c.date);const untimed=its.filter(x=>!x.h);
    body=`<div class="panel"><h3>Todo el día</h3>${untimed.length?untimed.map(x=>x.k==='fer'?`<span class="muted">${esc(x.t)}</span>`:evBtn(x)).join(''):'<span class="muted small">Sin pendientes sin hora</span>'}</div>
    <div class="dayv">${Array.from({length:17},(_,i)=>i+6).map(h=>{const hs=its.filter(x=>x.h&&+x.h.split(':')[0]===h);return `<div class="h">${tm(pad(h)+':00')}</div><div class="s">${hs.map(evBtn).join('')}</div>`}).join('')}</div>`}
  return `<div class="vhead"><div class="t"><span class="eyebrow">Agenda</span><h1>${title}</h1></div>
   <div class="row"><div class="seg" role="group" aria-label="Vista">${['mes','semana','dia'].map(m=>`<button data-a="calMode" data-m="${m}" aria-pressed="${c.mode===m}">${m==='dia'?'Día':cap(m)}</button>`).join('')}</div>
   <button class="btn" data-a="calMove" data-n="-1" aria-label="Anterior">‹</button><button class="btn" data-a="calToday">Hoy</button><button class="btn" data-a="calMove" data-n="1" aria-label="Siguiente">›</button></div></div>
  <div class="row between"><div class="legend">${[['tarea','Tarea'],['seg','Seguimiento'],['act','Actividad'],['reu','Reunión'],['serie','Reunión programada'],['vis','Visita']].map(([k,n])=>`<span><i style="--c:${KC[k]}"></i>${n}</span>`).join('')}<span><u>Subrayado</u>: abre su reunión o actividad</span>${c.mode==='mes'?'<span><b>Toca un día</b> para ver todo lo que tiene</span>':''}</div>
   <div class="row"><button class="btn sm pri" data-a="newTask" data-d="${c.date}">+ Tarea</button><button class="btn sm" data-a="newTask" data-d="${c.date}" data-seg="1">+ Seguimiento</button><button class="btn sm" data-a="newVisit" data-d="${c.date}">+ Visita</button></div></div>
  ${body}`}

/* ---------- Horarios (plegables por tipo) ---------- */
function vHorarios(){const hs=L('horarios').sort((a,b)=>(a.creado||'').localeCompare(b.creado||''));const h=UI.hor&&S.horarios[UI.hor];
  return `<div class="vhead"><div class="t"><span class="eyebrow">Planificar</span><h1>Horarios</h1></div></div>
  <div class="split"><div class="htypes">${Object.entries(HOR_TIPOS).map(([k,v])=>{const xs=hs.filter(x=>x.tipo===k);const open=UI.hopen[k];
    return `<div class="htype" data-open="${open?1:0}"><button data-a="hopen" data-k="${k}" aria-expanded="${!!open}"><span class="ic">${v.ic}</span><span><b>${v.n}</b><small>${xs.length?xs.length+(xs.length===1?' guardado':' guardados'):v.d}</small></span><span class="chev">›</span></button>
     ${open?`<div class="in-list">${xs.map(x=>`<button class="hlink" data-a="selHor" data-id="${x.id}" ${x.id===UI.hor?'aria-current="true"':''}><span>${esc(x.nombre||'Sin nombre')}</span><span class="small">${x.cols.length}×${x.rows.length}</span></button>`).join('')}
      <form class="add" data-a-submit="newHor" data-tipo="${k}"><input class="in" name="nombre" placeholder="Nombre del nuevo horario" required><button class="btn sm pri">Crear</button></form></div>`:''}</div>`}).join('')}</div>
  ${h?`<div class="detail"><div class="dhead" style="--c:var(--blue)"><div class="row between"><span class="when">${esc((HOR_TIPOS[h.tipo]||{}).n||'Personalizado')}</span>
     <div class="row"><button class="btn sm" data-a="horPdf" data-id="${h.id}">PDF</button><button class="btn sm" data-a="dupHor" data-id="${h.id}">Duplicar</button><button class="btn sm danger" data-a="askDel" data-col="horarios" data-id="${h.id}">Eliminar</button></div></div>
    <input class="title-in" data-f="horarios|${h.id}|nombre" value="${esc(h.nombre)}" aria-label="Nombre del horario"></div>
    <div class="tscroll"><table class="hor"><thead><tr><th class="slot"></th>${h.cols.map((c,i)=>`<th><input data-f="horarios|${h.id}|cols.${i}" value="${esc(c)}" aria-label="Columna ${i+1}"></th>`).join('')}</tr></thead><tbody>
     ${h.rows.map((r,ri)=>`<tr><th class="slot"><input data-f="horarios|${h.id}|rows.${ri}" value="${esc(r)}" aria-label="Fila ${ri+1}"></th>${h.cols.map((c,ci)=>{const k=ri+'-'+ci;const xs=(h.celdas||{})[k]||[];
       return `<td class="${xs.length?'':'e'}" data-a="cellAdd" data-id="${h.id}" data-k="${k}"><div class="chips">${xs.map((n,ni)=>`<span class="chip">${esc(n)}<button data-a="cellDel" data-id="${h.id}" data-k="${k}" data-i="${ni}" aria-label="Quitar">×</button></span>`).join('')}</div></td>`}).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="row"><button class="btn sm" data-a="horAdd" data-w="row" data-id="${h.id}">+ Fila</button><button class="btn sm" data-a="horAdd" data-w="col" data-id="${h.id}">+ Columna</button><button class="btn sm ghost" data-a="horRem" data-w="row" data-id="${h.id}">− Fila</button><button class="btn sm ghost" data-a="horRem" data-w="col" data-id="${h.id}">− Columna</button></div>
    <details><summary class="small">Notas</summary><textarea id="hn" class="in" style="margin-top:6px" data-f="horarios|${h.id}|notas" aria-label="Notas">${esc(h.notas||'')}</textarea></details></div>`:'<div class="empty">Abre un tipo de horario a la izquierda y elige uno guardado, o crea uno nuevo.</div>'}
  </div>`}

/* ---------- Actividades ---------- */
function actStub(x){const col=ACT_COL[x.tipo]||'#7a4fe0';if(!x.desde)return `<span class="stub" style="--c:${col}"><small>Sin</small><b>—</b><small>fecha</small></span>`;const a=pd(x.desde),r=x.hasta&&x.hasta!==x.desde?pd(x.hasta):null;
  if(!r)return `<span class="stub" style="--c:${col}"><small>${D3[a.getDay()]}</small><b>${a.getDate()}</b><small>${M3[a.getMonth()]}</small></span>`;
  return `<span class="stub" style="--c:${col}"><small>${D3[a.getDay()]}–${D3[r.getDay()]}</small><b class="rg">${a.getDate()}–${r.getDate()}</b><small>${M3[a.getMonth()]}${r.getMonth()!==a.getMonth()?'–'+M3[r.getMonth()]:''}</small></span>`}
/* Lista de fechas: al tocar una, su planificador se abre ahí mismo (sin columna al lado ni pestañas) */
function monthHead(d){if(!d)return 'Sin fecha';const x=pd(d);return cap(MESES[x.getMonth()])+' '+x.getFullYear()}
const chev=o=>`<span class="chev" aria-hidden="true">${o?'▴':'▾'}</span>`;
const roleWho=r=>pname(r.personaId)||r.nombre||'';
const whoName=x=>x.personaId?pname(x.personaId):(x.nombre||'');
const findPersona=n=>{n=norm(n);return n?L('personas').find(p=>norm(p.nombre)===n):null};
const pl=(n,s,p)=>n+' '+(n===1?s:p);
const splitNames=s=>String(s||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
function showCard(id){const c=document.getElementById('card-'+id);if(c)c.scrollIntoView({block:'start',behavior:'smooth'})}
function psec(kind,key,n,title,sum,body){const open=!!UI[kind][key];
  return `<section class="psec ${open?'open':''}"><button class="ph" data-a="togSec" data-k="${kind}" data-s="${key}" aria-expanded="${open}"><span class="pn">${n}</span><span class="pt"><b>${title}</b><small>${sum}</small></span>${chev(open)}</button>${open?`<div class="pb">${body()}</div>`:''}</section>`}
function vActividades(){const T=today();let as=L('actividades');
  as=UI.actFilter==='proximas'?as.filter(a=>(a.hasta||a.desde||T)>=T):UI.actFilter==='pasadas'?as.filter(a=>(a.hasta||a.desde||T)<T):as;
  as.sort((a,b)=>(a.desde||'9').localeCompare(b.desde||'9')*(UI.actFilter==='pasadas'?-1:1));
  if(UI.act&&!S.actividades[UI.act])UI.act=null;let mh=null;
  return `<div class="vhead"><div class="t"><span class="eyebrow">Ejecutar</span><h1>Actividades</h1></div><div class="seg">${[['proximas','Próximas'],['pasadas','Pasadas'],['todas','Todas']].map(([k,n])=>`<button data-a="actFilter" data-f="${k}" aria-pressed="${UI.actFilter===k}">${n}</button>`).join('')}</div></div>
  <form class="add" data-a-submit="newAct"><input class="in" name="nombre" placeholder="Nueva actividad: escribe el nombre" required><input class="in" type="date" name="fecha" style="flex:0 1 160px" aria-label="Fecha"><button class="btn pri">Crear</button></form>
  <p class="muted small">Toca una fecha para abrir su planificador. Tócala otra vez para cerrarlo.</p>
  <div class="alist">${as.map(x=>{const open=x.id===UI.act;const n=tasksOf('actividad',x.id);const done=n.filter(t=>!isOpen(t)).length;const rs=x.roles||[];const m=monthHead(x.desde);const head=m!==mh?`<div class="mhead">${m}</div>`:'';mh=m;
    return `${head}<div class="acard ${open?'open':''} ${(x.hasta||x.desde)<T?'past':''}" id="card-${x.id}"><button class="item" data-a="selAct" data-id="${x.id}" aria-expanded="${open}">${actStub(x)}
      <span class="body"><span class="nm">${esc(x.nombre||'Sin nombre')}</span>${x.objetivo&&!open?`<span class="desc">${esc(x.objetivo)}</span>`:''}<span class="sub"><span>${ACT_TYPES[x.tipo]||''}</span><span>${ACT_ESTADOS[x.estado||'idea']}</span>${rs.length?`<span class="num">Equipo ${rs.filter(roleWho).length}/${rs.length}</span>`:''}${n.length?`<span class="num">${done}/${n.length} tareas</span>`:''}</span></span>${chev(open)}</button>
      ${open?`<div class="abody">${actPlan(x)}<button class="btn sm ghost closer" data-a="selAct" data-id="${x.id}">Cerrar ▴</button></div>`:''}</div>`}).join('')||'<div class="empty">No hay actividades en este filtro.</div>'}</div>`}
function fullRange(a,b){if(!a)return 'Sin fecha';if(!b||b===a)return fshort(a);const A=pd(a),B=pd(b);return A.getMonth()===B.getMonth()?`${cap(DIAS[A.getDay()])} ${A.getDate()} al ${DIAS[B.getDay()]} ${B.getDate()} de ${MESES[B.getMonth()]}`:`${fshort(a)} al ${fshort(b).toLowerCase()}`}
function actReuniones(a){const out=[];L('reuniones').forEach(r=>(r.temas||[]).forEach(t=>{if(t.actividadId===a.id)out.push({r,t})}));return out.sort((x,y)=>(y.r.fecha||'').localeCompare(x.r.fecha||''))}
function budgetOf(a){const n=+a.metaAsistencia||0;let total=0,compra=0,aporte=0;(a.materiales||[]).forEach(m=>{const q=(+m.cant||0)*(m.porPersona?n:1);const st=q*(+m.costo||0);total+=st;if((m.fuente||'compra')==='compra')compra+=st;else aporte+=st});return {total,compra,aporte,n,porPersona:n?compra/n:0}}
/* Planificador de una actividad: pasos numerados que se abren y cierran. Cada paso dice en una línea cómo va. */
function actPlan(a,{title=false}={}){const id=a.id,F=p=>`actividades|${id}|${p}`;const roles=a.roles||[];const ts=tasksOf('actividad',id);const reus=actReuniones(a);
  const part=a.participantes||[];const ms=a.momentos||[];const mats=a.materiales||[];const ev=a.evaluacion||{};const b=budgetOf(a);
  const it=(a.itinerario||[]).slice().sort((x,y)=>(x.hora||'').localeCompare(y.hora||''));
  const rolOpts=sel=>roles.map(r=>`<option value="${r.id}" ${r.id===sel?'selected':''}>${esc(r.rol)}${roleWho(r)?' · '+esc(roleWho(r)):''}</option>`).join('');
  const when=a.desde?fshort(a.desde)+(a.hasta&&a.hasta!==a.desde?' al '+fshort(a.hasta).toLowerCase():''):'Sin fecha';
  const sBasico=[a.desde?fdate(a.desde)+(a.hasta&&a.hasta!==a.desde?' al '+fdate(a.hasta):''):'Falta la fecha',a.hora?tm(a.hora):'',a.lugar?esc(a.lugar):'Falta el lugar',a.metaAsistencia?'esperamos '+fmt(a.metaAsistencia):''].filter(Boolean).join(' · ');
  const sEquipo=(roles.length?`${roles.filter(roleWho).length} de ${roles.length} roles con nombre`:'Todavía sin roles')+(part.length?` · ${part.length} más van`:'');
  const sProg=ms.length||it.length?`${pl(ms.length,"momento","momentos")} · ${pl(it.length,"paso","pasos")} con hora`:'Sin programa todavía';
  const sMat=mats.length?`${mats.length} en la lista · ${money(b.total)} · ${mats.filter(m=>m.listo).length} listos`:'Sin lista todavía';
  const sTar=ts.length?`${ts.filter(isOpen).length} por hacer · ${ts.filter(t=>!isOpen(t)).length} hechas`:'Sin pendientes anotados';
  const sIdeas=(a.ideas||[]).length||reus.length?`${pl((a.ideas||[]).length,"idea","ideas")} · hablada en ${pl(reus.length,"reunión","reuniones")}`:'Nada todavía';
  const sEval=ev.asistencia!=null?`Asistieron ${fmt(ev.asistencia)}${ev.nuevos?' · '+fmt(ev.nuevos)+' nuevos':''}`:'Se llena cuando termine la actividad';

  const basico=()=>`<div class="f"><label for="an">Nombre de la actividad</label><input id="an" data-f="${F('nombre')}" data-mirror value="${esc(a.nombre||'')}" placeholder="Nombre de la actividad"></div>
    <div class="grid4">
     <div class="f"><label for="ad">Fecha</label><input id="ad" type="date" data-f="${F('desde')}" data-rr value="${a.desde||''}"></div>
     <div class="f"><label for="ah">Hasta (si dura más de un día)</label><input id="ah" type="date" data-f="${F('hasta')}" data-rr value="${a.hasta||''}"></div>
     <div class="f"><label for="ahr">Hora</label><input id="ahr" type="time" data-f="${F('hora')}" value="${a.hora||''}"></div>
     <div class="f"><label for="al">Lugar</label><input id="al" data-f="${F('lugar')}" value="${esc(a.lugar||'')}"></div>
     <div class="f"><label for="ac">Corregimiento</label><input id="ac" list="dl-corr" data-corr="${F('corrId')}" value="${esc(corrLabel(a.corrId))}" placeholder="Buscar…"></div>
     <div class="f"><label for="am">Cuántas personas esperamos</label><input id="am" type="number" min="0" data-f="${F('metaAsistencia')}" data-t="num" data-rr value="${a.metaAsistencia??''}"></div>
     <div class="f"><label for="at">Tipo</label><select id="at" data-f="${F('tipo')}" data-rr>${Object.entries(ACT_TYPES).map(([k,v])=>`<option value="${k}" ${a.tipo===k?'selected':''}>${v}</option>`).join('')}</select></div>
     <div class="f"><label for="ae">Estado</label><select id="ae" data-f="${F('estado')}" data-rr>${Object.entries(ACT_ESTADOS).map(([k,v])=>`<option value="${k}" ${a.estado===k?'selected':''}>${v}</option>`).join('')}</select></div></div>
    <div class="f"><label for="ao">Para qué es (objetivo)</label><textarea id="ao" data-f="${F('objetivo')}" placeholder="Qué queremos lograr y cómo sabremos que salió bien">${esc(a.objetivo||'')}</textarea></div>`;

  const equipo=()=>{const missing=SUGG_ROLES.filter(([r])=>!roles.some(x=>x.rol===r));const desc=Object.fromEntries(SUGG_ROLES);
    return `<p class="muted small">Cada tarjeta es un rol. Escribe el nombre de quien lo lleva: si ya está en Estructura aparece al escribir; si no, queda el nombre tal como lo pongas.</p>
    ${roles.length?`<div class="roles">${roles.map((r,i)=>`<div class="rolec ${roleWho(r)?'ok':''}">
      <div class="rh"><input class="rn" data-f="${F('roles.'+i+'.rol')}" value="${esc(r.rol)}" aria-label="Rol"><button class="x" data-a="delRow" data-col="actividades" data-id="${id}" data-arr="roles" data-i="${i}" aria-label="Quitar rol">×</button></div>
      ${desc[r.rol]?`<small class="rd">${esc(desc[r.rol])}</small>`:''}
      <input class="in" list="dl-pers" data-pick="${F('roles.'+i)}" value="${esc(roleWho(r))}" placeholder="¿Quién? Escribe un nombre" aria-label="Quién lleva este rol">
      ${roleWho(r)?`<button class="btn sm ghost" data-a="waRole" data-id="${id}" data-r="${r.id}">Enviarle su parte</button>`:''}</div>`).join('')}</div>`:''}
    <div class="lbl">${roles.length?'Más roles':'Roles sugeridos'} · toca uno para agregarlo</div>
    <div class="sugg">${missing.map(([r,d])=>`<button class="sg" data-a="addSugg" data-id="${id}" data-r="${esc(r)}"><b>+ ${esc(r)}</b><small>${esc(d)}</small></button>`).join('')}<button class="sg" data-a="addRole" data-id="${id}"><b>+ Otro rol</b><small>Uno que no está en la lista</small></button></div>
    ${missing.length>1?`<div class="row"><button class="btn sm" data-a="addSuggRoles" data-id="${id}">Agregar todos los sugeridos</button></div>`:''}
    <div class="sub2"><h3>Quiénes más van <span class="muted num">${part.filter(p=>p.confirmado).length}/${part.length} confirmados</span></h3>
     <div class="chips">${part.map((x,i)=>{const n=whoName(x);return `<span class="chip ${x.confirmado?'on':''}"><button data-a="togPart" data-id="${id}" data-i="${i}" style="display:flex;gap:6px;align-items:center;color:inherit;padding:0" aria-pressed="${!!x.confirmado}">${avatar(n)}${esc(n)}</button><button data-a="delRow" data-col="actividades" data-id="${id}" data-arr="participantes" data-i="${i}" aria-label="Quitar">×</button></span>`}).join('')||'<span class="muted small">Anota aquí a voluntarios e invitados. Toca un nombre cuando confirme.</span>'}</div>
     <form class="row" data-a-submit="addPart" data-id="${id}"><input class="in" name="nombres" list="dl-pers" placeholder="Escribe un nombre (o varios separados por coma)" style="flex:1 1 220px" required><button class="btn sm pri">Agregar</button></form></div>`};

  const programa=()=>`<p class="muted small">Primero los momentos del evento, en orden, y qué se necesita en cada uno. Abajo, si hace falta, el paso a paso con hora para enviarle a cada quien su parte.</p>
    ${ms.length?`<div class="moments">${ms.map((m,i)=>`<div class="mom" data-n="${i+1}"><input type="text" data-f="${F('momentos.'+i+'.hora')}" value="${esc(m.hora||'')}" placeholder="Hora" aria-label="Hora">
      <div><input class="nm" data-f="${F('momentos.'+i+'.nombre')}" value="${esc(m.nombre||'')}" aria-label="Momento"><div class="grid2" style="gap:4px"><select data-f="${F('momentos.'+i+'.rolId')}" aria-label="Responsable"><option value="">Responsable…</option>${rolOpts(m.rolId)}</select>
       <textarea data-f="${F('momentos.'+i+'.necesita')}" placeholder="Qué se necesita (separa con comas)" aria-label="Qué se necesita">${esc(m.necesita||'')}</textarea></div></div>
      <div class="row momx"><button class="btn sm ghost" data-a="momToMat" data-id="${id}" data-i="${i}" title="Pasar lo que se necesita a la lista de qué llevar">→ Qué llevar</button><button class="x" data-a="delRow" data-col="actividades" data-id="${id}" data-arr="momentos" data-i="${i}" aria-label="Quitar momento">×</button></div></div>`).join('')}</div>`:''}
    <div class="row">${ms.length?'':`<button class="btn pri sm" data-a="momTemplate" data-id="${id}">Usar la estructura sugerida (${ACT_TYPES[a.tipo||'masiva']})</button>`}<button class="btn sm" data-a="addMom" data-id="${id}">+ Momento</button></div>
    <div class="sub2"><div class="row between"><h3>Paso a paso con hora</h3><div class="row"><div class="seg">${[['lista','Todo junto'],['actor','Por persona']].map(([k,n])=>`<button data-a="actView" data-v="${k}" aria-pressed="${UI.actView===k}">${n}</button>`).join('')}</div><button class="btn sm pri" data-a="addStep" data-id="${id}">+ Paso</button></div></div>
    ${UI.actView==='lista'?(it.length?`<div class="tscroll"><table class="ed"><thead><tr><th style="width:110px">Hora</th><th style="width:26%">Quién</th><th>Qué hace</th><th>Detalle</th><th style="width:36px"></th></tr></thead><tbody>
      ${it.map(s=>{const i=a.itinerario.indexOf(s);return `<tr><td><input type="time" data-f="${F('itinerario.'+i+'.hora')}" value="${s.hora||''}" aria-label="Hora"></td>
       <td><select data-f="${F('itinerario.'+i+'.rolId')}" aria-label="Quién"><option value="">Todos</option>${rolOpts(s.rolId)}</select></td>
       <td><input class="need" data-f="${F('itinerario.'+i+'.accion')}" value="${esc(s.accion||'')}" placeholder="Qué hace" aria-label="Acción"></td><td><input data-f="${F('itinerario.'+i+'.detalle')}" value="${esc(s.detalle||'')}" placeholder="Lugar, materiales, nota" aria-label="Detalle"></td>
       <td><button class="x" data-a="delRow" data-col="actividades" data-id="${id}" data-arr="itinerario" data-i="${i}" aria-label="Quitar paso">×</button></td></tr>`}).join('')}</tbody></table></div>`:'<span class="muted small">Agrega los pasos con hora y quién los hace. En "Por persona" le envías a cada uno su parte.</span>')
    :`<div class="actors">${[...roles,{id:'',rol:'Todos'}].map(r=>{const st=it.filter(s=>(s.rolId||'')===r.id);if(!r.id&&!st.length)return '';
      return `<div class="actor"><div class="row between"><b>${esc(r.rol)}</b>${r.id?`<button class="btn sm" data-a="waRole" data-id="${id}" data-r="${r.id}">Enviar</button>`:''}</div><span class="small muted">${esc(roleWho(r)||'Sin responsable')}</span>
       ${st.length?`<ol>${st.map(s=>`<li><b class="h">${s.hora?tm(s.hora):'--'}</b> ${esc(s.accion||'')}${s.detalle?` <span class="muted">· ${esc(s.detalle)}</span>`:''}</li>`).join('')}</ol>`:'<span class="small muted">Sin pasos asignados</span>'}</div>`}).join('')}</div>`}</div>`;

  const materiales=()=>{const kit=(KIT[a.tipo||'masiva']||[]).filter(k=>!mats.some(m=>norm(m.item)===norm(k[0])));
    return `<div class="budget"><div><span>Total estimado</span><b>${money(b.total)}</b></div><div><span>Hay que comprar</span><b>${money(b.compra)}</b></div><div><span>Aportes y préstamos</span><b>${money(b.aporte)}</b></div><div><span>Costo por asistente</span><b>${b.n?money(b.porPersona):'—'}</b></div>
     <div class="row" style="margin-left:auto"><button class="btn sm" data-a="budgetPdf" data-id="${id}">Presupuesto PDF</button></div></div>
    ${!b.n?'<div class="note warn small">Pon cuántas personas esperamos en "Lo básico" para calcular lo que va "por persona".</div>':''}
    ${mats.length?`<div class="tscroll"><table class="ed" style="min-width:860px"><thead><tr><th>Material</th><th style="width:76px" class="r">Cant.</th><th style="width:84px">×persona</th><th style="width:90px">Unidad</th><th style="width:96px" class="r">Costo unit.</th><th style="width:110px">Fuente</th><th style="width:150px">Responsable</th><th style="width:96px" class="r">Subtotal</th><th style="width:44px">Listo</th><th style="width:34px"></th></tr></thead><tbody>
     ${mats.map((m,i)=>{const q=(+m.cant||0)*(m.porPersona?b.n:1);return `<tr><td><input data-f="${F('materiales.'+i+'.item')}" value="${esc(m.item||'')}" aria-label="Material"></td><td><input class="r" type="number" min="0" step="any" data-f="${F('materiales.'+i+'.cant')}" data-t="num" data-rr value="${m.cant??''}" aria-label="Cantidad"></td>
      <td><label class="small"><input type="checkbox" data-f="${F('materiales.'+i+'.porPersona')}" data-t="bool" data-rr ${m.porPersona?'checked':''}> ${m.porPersona?'= '+fmt(q):''}</label></td>
      <td><input data-f="${F('materiales.'+i+'.unidad')}" value="${esc(m.unidad||'')}" aria-label="Unidad"></td><td><input class="r" type="number" min="0" step="0.01" data-f="${F('materiales.'+i+'.costo')}" data-t="num" data-rr value="${m.costo??''}" aria-label="Costo unitario"></td>
      <td><select data-f="${F('materiales.'+i+'.fuente')}" data-rr aria-label="Fuente">${Object.entries(FUENTES).map(([k,v])=>`<option value="${k}" ${(m.fuente||'compra')===k?'selected':''}>${v}</option>`).join('')}</select></td>
      <td><select data-f="${F('materiales.'+i+'.responsableId')}" aria-label="Responsable">${personOptions(m.responsableId,'—')}</select></td>
      <td class="r num">${money(q*(+m.costo||0))}</td><td><input type="checkbox" data-f="${F('materiales.'+i+'.listo')}" data-t="bool" ${m.listo?'checked':''} aria-label="Listo"></td>
      <td><button class="x" data-a="delRow" data-col="actividades" data-id="${id}" data-arr="materiales" data-i="${i}" aria-label="Quitar">×</button></td></tr>`}).join('')}</tbody>
     <tfoot><tr><td colspan="7">Total</td><td class="r num">${money(b.total)}</td><td colspan="2"></td></tr></tfoot></table></div>`:''}
    <div class="row"><button class="btn sm pri" data-a="addMat" data-id="${id}">+ Material</button>${kit.length?`<span class="small muted">Sugeridos:</span>${kit.slice(0,8).map(k=>`<button class="tag" data-a="addKit" data-id="${id}" data-k="${esc(k[0])}">+ ${esc(k[0])}</button>`).join('')}`:''}</div>
    <p class="small muted">Los costos sugeridos son referencias para arrancar; ajústalos con tus cotizaciones. Marca "×persona" cuando la cantidad depende de cuántos asistan.</p>`};

  const tareas=()=>`<p class="muted small">Lo que hay que resolver antes del día: qué, quién y para cuándo.</p>${quickTaskForm('actividad',id)}<div class="tlist">${ts.map(t=>taskRow(t,{showOrigin:false})).join('')||'<span class="muted small">Sin pendientes todavía.</span>'}</div>`;

  const ideas=()=>`${ideasBlock('actividades',a)}
    <div class="sub2"><h3>Lo que se habló en reuniones</h3>${reus.length?`<div class="timeline">${reus.map(({r,t})=>`<div class="tl"><div class="d">${fshort(r.fecha)}<small>${esc(r.titulo||'Reunión')}</small></div><div><b>${esc(t.texto)}</b>${t.notas?`<p class="small" style="white-space:pre-wrap">${esc(t.notas)}</p>`:'<p class="small muted">Sin notas</p>'}<button class="olink small" data-a="openReu" data-id="${r.id}">Abrir la reunión</button></div></div>`).join('')}</div>`:'<span class="muted small">Cuando en una reunión vinculen un tema a esta actividad, lo que se habló aparece aquí solo.</span>'}</div>`;

  const evaluacion=()=>`<div class="grid2"><div class="f"><label for="ea">Cuántos asistieron</label><input id="ea" type="number" min="0" data-f="${F('evaluacion.asistencia')}" data-t="num" value="${ev.asistencia??''}"></div>
     <div class="f"><label for="en">Jóvenes nuevos captados</label><input id="en" type="number" min="0" data-f="${F('evaluacion.nuevos')}" data-t="num" value="${ev.nuevos??''}"></div>
     <div class="f"><label for="el">Qué salió bien</label><textarea id="el" data-f="${F('evaluacion.logros')}">${esc(ev.logros||'')}</textarea></div>
     <div class="f"><label for="em">Qué mejorar</label><textarea id="em" data-f="${F('evaluacion.mejorar')}">${esc(ev.mejorar||'')}</textarea></div></div>`;

  return `<div class="plan">${title?`<h2>${esc(a.nombre||'Actividad')}</h2>`:''}
   <div class="row between ptools"><span class="when">${when}${a.lugar?' · '+esc(a.lugar):''}</span><div class="row"><button class="btn sm" data-a="actPdf" data-id="${id}">Ficha PDF</button><button class="btn sm danger" data-a="askDel" data-col="actividades" data-id="${id}">Eliminar</button></div></div>
   ${psec('asec','basico',1,'Lo básico: cuándo, dónde y para qué',sBasico,basico)}
   ${psec('asec','equipo',2,'Quién hace qué',sEquipo,equipo)}
   ${psec('asec','programa',3,'Programa del día',sProg,programa)}
   ${psec('asec','materiales',4,'Qué llevar y cuánto cuesta',sMat,materiales)}
   ${psec('asec','tareas',5,'Pendientes antes del día',sTar,tareas)}
   ${psec('asec','ideas',6,'Ideas y lo hablado en reuniones',sIdeas,ideas)}
   ${psec('asec','evaluacion',7,'Después: cómo salió',sEval,evaluacion)}</div>`}
function actDetail(a){return actPlan(a,{title:true})}
function ideasBlock(col,o){return `<form class="row" data-a-submit="addIdea" data-col="${col}" data-id="${o.id}"><input class="in" name="texto" placeholder="Escribe la idea" style="flex:2 1 180px" required><input class="in" name="autor" placeholder="De quién" style="flex:1 1 110px"><button class="ideabtn">Idea</button></form>
  <ul class="ideas">${(o.ideas||[]).map((x,i)=>`<li><span>${esc(x.texto)}${x.autor?`<span class="by">${esc(x.autor)}</span>`:''}</span><span class="row"><button class="btn sm" data-a="ideaTask" data-col="${col}" data-id="${o.id}" data-i="${i}">Volver tarea</button><button class="x" data-a="delRow" data-col="${col}" data-id="${o.id}" data-arr="ideas" data-i="${i}" aria-label="Quitar idea">×</button></span></li>`).join('')}</ul>`}

/* ---------- Reuniones ---------- */
const reuSecs=r=>r&&r.estado==='terminada'?{temas:true,acuerdos:true}:{asist:true,temas:true,acuerdos:true};
function vReuniones(){let rs=L('reuniones').sort((a,b)=>((b.fecha||'')+(b.hora||'')).localeCompare((a.fecha||'')+(a.hora||'')));
  if(UI.reuFilter==='abiertas')rs=rs.filter(r=>r.estado!=='terminada');if(UI.reuFilter==='terminadas')rs=rs.filter(r=>r.estado==='terminada');
  if(UI.reu&&!S.reuniones[UI.reu])UI.reu=null;let mh=null;
  const ser=L('series').sort((a,b)=>(a.creado||'').localeCompare(b.creado||''));
  return `<div class="vhead"><div class="t"><span class="eyebrow">Ejecutar</span><h1>Reuniones</h1></div><div class="seg">${[['todas','Todas'],['abiertas','Abiertas'],['terminadas','Con minuta']].map(([k,n])=>`<button data-a="reuFilter" data-f="${k}" aria-pressed="${UI.reuFilter===k}">${n}</button>`).join('')}</div></div>
  <section class="flat"><header><h2>Programadas</h2><span class="small muted">Se repiten solas en la agenda hasta que las cambies</span></header>
   <div class="series">${ser.map(s=>{const nx=nextOf(s);return `<div class="serie" style="--sc:${s.color||'#e0457b'}"><b>${esc(s.nombre)}</b><small>${esc(serieLabel(s))}${s.lugar?' · '+esc(s.lugar):''}</small>${nx?`<span class="nx">Próxima: ${fdate(nx)}</span>`:'<span class="nx">Sin próxima fecha</span>'}
     <div class="row">${nx?`<button class="btn sm" data-a="openSerie" data-id="${s.id}" data-d="${nx}">Abrir próxima</button>`:''}<button class="btn sm" data-a="editSerie" data-id="${s.id}">${s.dia==null||s.dia===''?'Poner día y hora':'Editar'}</button></div></div>`}).join('')}
    <button class="serie newser" data-a="editSerie" data-id=""><b>+ Reunión programada</b><small>Ej. redes, formación, coordinadores</small></button></div></section>
  <form class="add" data-a-submit="newReu"><input class="in" name="titulo" placeholder="Nueva reunión: escribe el nombre" required><input class="in" type="date" name="fecha" style="flex:0 1 160px" aria-label="Fecha"><button class="btn pri">Crear</button></form>
  <p class="muted small">Toca una fecha para abrir la reunión. Tócala otra vez para cerrarla.</p>
  <div class="alist">${rs.map(x=>{const open=x.id===UI.reu;const s=S.series[x.serieId];const m=monthHead(x.fecha);const head=m!==mh?`<div class="mhead">${m}</div>`:'';mh=m;
    return `${head}<div class="acard ${open?'open':''}" id="card-${x.id}"><button class="item" data-a="selReu" data-id="${x.id}" aria-expanded="${open}"><span class="stub" style="--c:${x.estado==='terminada'?'#0f9b67':(s&&s.color)||'#00a3b8'}">${x.fecha?`<small>${D3[pd(x.fecha).getDay()]}</small><b>${pd(x.fecha).getDate()}</b><small>${M3[pd(x.fecha).getMonth()]}</small>`:'<b>—</b>'}</span>
     <span class="body"><span class="nm">${esc(x.titulo||'Reunión')}</span>${open?'':`<span class="desc">${esc([x.hora?tm(x.hora):'',x.lugar||'',(x.temas||[]).map(t=>t.texto).join(' · ')].filter(Boolean).join(' — ')||'Sin temas todavía')}</span>`}<span class="sub"><span>${(x.asistentes||[]).filter(a=>a.presente).length} presentes</span><span>${pl((x.temas||[]).length,"tema","temas")}</span><span>${x.estado==='terminada'?'Minuta lista':'Abierta'}</span></span></span>${chev(open)}</button>
     ${open?`<div class="abody">${reuPlan(x)}<button class="btn sm ghost closer" data-a="selReu" data-id="${x.id}">Cerrar ▴</button></div>`:''}</div>`}).join('')||'<div class="empty">Abre una reunión programada o crea una nueva arriba.</div>'}</div>`}
function reuPlan(r,{title=false}={}){const id=r.id,F=p=>`reuniones|${id}|${p}`;const att=r.asistentes||[];const pres=att.filter(a=>a.presente).length;const closed=r.estado==='terminada';const s=S.series[r.serieId];const temas=r.temas||[];const ts=tasksOf('reunion',id);
  const prev=r.prevId&&S.reuniones[r.prevId]?S.reuniones[r.prevId]:(r.serieId?L('reuniones').filter(x=>x.serieId===r.serieId&&x.fecha<r.fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0]:null);
  const prevOpen=prev?tasksOf('reunion',prev.id).filter(isOpen):[];
  const acts=L('actividades').filter(a=>(a.hasta||a.desde||'9')>=addDays(r.fecha||today(),-30)).sort((a,b)=>(a.desde||'').localeCompare(b.desde||''));
  const sBasico=[r.fecha?fdate(r.fecha):'Falta la fecha',r.hora?tm(r.hora)+(r.horaFin?' a '+tm(r.horaFin):''):'',r.lugar?esc(r.lugar):'Falta el lugar'].filter(Boolean).join(' · ');
  const sAsist=att.length?`${pres} presentes de ${att.length} en la lista`:'Todavía sin nombres';
  const sTemas=temas.length?`${pl(temas.length,"tema","temas")} · ${temas.filter(t=>t.ok).length} tratados`:'Sin temas todavía';
  const sAcu=ts.length?`${pl(ts.length,"acuerdo","acuerdos")} · ${ts.filter(isOpen).length} por hacer`:'Sin acuerdos todavía';
  const sIdeas=(r.ideas||[]).length?`${pl(r.ideas.length,"idea","ideas")}`:'Ninguna todavía';
  const sAp=r.apuntes||r.transcripcion?'Con apuntes':'Vacío';

  const basico=()=>`<div class="f"><label for="rt">Nombre de la reunión</label><input id="rt" data-f="${F('titulo')}" data-mirror value="${esc(r.titulo||'')}"></div>
    <div class="grid4"><div class="f"><label for="rf">Fecha</label><input id="rf" type="date" data-f="${F('fecha')}" data-rr value="${r.fecha||''}"></div>
    <div class="f"><label for="rh">Empieza</label><input id="rh" type="time" data-f="${F('hora')}" value="${r.hora||''}"></div>
    <div class="f"><label for="rhf">Termina</label><input id="rhf" type="time" data-f="${F('horaFin')}" value="${r.horaFin||''}"></div>
    <div class="f"><label for="rl">Lugar o enlace</label><input id="rl" data-f="${F('lugar')}" value="${esc(r.lugar||'')}"></div></div>`;

  const asist=()=>`<p class="muted small">Escribe los nombres y toca cada uno para marcar si vino (azul = presente).</p>
    <div class="chips">${att.map((x,i)=>{const n=whoName(x);return `<span class="chip ${x.presente?'on':''}"><button data-a="togAtt" data-id="${id}" data-i="${i}" style="display:flex;gap:6px;align-items:center;color:inherit;padding:0" aria-pressed="${!!x.presente}">${avatar(n)}${esc(n)}</button><button data-a="delRow" data-col="reuniones" data-id="${id}" data-arr="asistentes" data-i="${i}" aria-label="Quitar">×</button></span>`}).join('')||'<span class="muted small">Todavía no hay nadie en la lista.</span>'}</div>
    <form class="row" data-a-submit="addAtt" data-id="${id}"><input class="in" name="nombres" list="dl-pers" placeholder="Escribe un nombre (o varios separados por coma)" style="flex:1 1 220px" required><button class="btn sm pri">Agregar</button><button type="button" class="btn sm ghost" data-a="addAllTeam" data-id="${id}">+ Todo el círculo 0</button></form>`;

  const temasB=()=>`<p class="muted small">Un tema por línea. Marca la casilla cuando se trate y anota lo que se habló. Si el tema es de una actividad, vincúlalo y queda guardado en ella.</p>
    ${temas.map((t,i)=>`<div class="topic ${t.ok?'ok':''}"><div class="th"><input type="checkbox" data-f="${F('temas.'+i+'.ok')}" data-t="bool" data-rr ${t.ok?'checked':''} aria-label="Tema tratado"><b>${esc(t.texto)}</b><button class="x" data-a="delRow" data-col="reuniones" data-id="${id}" data-arr="temas" data-i="${i}" aria-label="Quitar tema">×</button></div>
      <textarea data-f="${F('temas.'+i+'.notas')}" placeholder="Lo que se habló de este tema">${esc(t.notas||'')}</textarea>
      <div class="row link"><select class="in" style="width:auto;flex:1 1 200px;padding:5px 9px" data-f="${F('temas.'+i+'.actividadId')}" data-rr aria-label="Actividad vinculada"><option value="">Sin actividad vinculada</option>${acts.map(a=>`<option value="${a.id}" ${a.id===t.actividadId?'selected':''}>${esc(a.nombre||'Actividad')} · ${fdate(a.desde)}</option>`).join('')}</select>
       ${t.actividadId?`<button class="olink" data-a="drawerAct" data-id="${t.actividadId}">Ver actividad</button>`:''}<button class="btn sm ghost" data-a="topicTask" data-id="${id}" data-i="${i}">+ Tarea</button></div></div>`).join('')}
    <form class="row" data-a-submit="addTopic" data-id="${id}"><input class="in" name="texto" placeholder="Nuevo tema" style="flex:1" required><button class="btn sm pri">Agregar</button></form>`;

  const acuerdos=()=>`<p class="muted small">Cada acuerdo es una tarea: qué, quién y para cuándo. Quedan en la agenda con enlace a esta reunión.</p>${quickTaskForm('reunion',id)}<div class="tlist">${ts.map(t=>taskRow(t,{showOrigin:false})).join('')||'<span class="muted small">Sin acuerdos todavía.</span>'}</div>`;

  const apuntes=()=>`<div class="f"><label for="rap">Apuntes generales</label><textarea id="rap" style="min-height:140px" data-f="${F('apuntes')}" placeholder="Lo que no cabe en un tema">${esc(r.apuntes||'')}</textarea></div>
    <div class="f"><label for="rtr">Transcripción</label><textarea id="rtr" style="min-height:100px" data-f="${F('transcripcion')}" placeholder="Pega aquí la transcripción de la grabación">${esc(r.transcripcion||'')}</textarea></div>`;

  return `<div class="plan">${title?`<h2>${esc(r.titulo||'Reunión')}</h2>`:''}
   <div class="row between ptools"><span class="when">${r.fecha?fshort(r.fecha):'Sin fecha'}${r.hora?' · '+tm(r.hora):''}${s?' · Programada':''}${closed?' · Terminada':''}</span>
    <div class="row">${closed?`<button class="btn sm pri" data-a="reuPdf" data-id="${id}">Descargar minuta</button><button class="btn sm" data-a="reopenReu" data-id="${id}">Reabrir</button>`:''}<button class="btn sm danger" data-a="askDel" data-col="reuniones" data-id="${id}">Eliminar</button></div></div>
   ${prevOpen.length?`<section class="note"><b>Pendientes de la reunión anterior (${fdate(prev.fecha)})</b><div class="tlist">${prevOpen.map(t=>taskRow(t,{showOrigin:false})).join('')}</div></section>`:''}
   ${psec('rsec','basico',1,'Cuándo y dónde',sBasico,basico)}
   ${psec('rsec','asist',2,'Quiénes vinieron',sAsist,asist)}
   ${psec('rsec','temas',3,'De qué se habló',sTemas,temasB)}

function barPairs(data,names=['Creadas','Cumplidas']){const W=560,H=200,pl=28,pb=26,pt=14;const max=Math.max(1,...data.map(d=>Math.max(d.c,d.h)));const nice=Math.ceil(max/4)*4||4;
  const bw=(W-pl-8)/data.length;const y=v=>pt+(H-pt-pb)*(1-v/nice);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${names[0]} y ${names[1]}">`;
  for(let i=0;i<=4;i++){const v=nice*i/4;s+=`<line class="grid" x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  data.forEach((d,i)=>{const x=pl+i*bw+bw*.14,w=(bw*.72-2)/2;
    const r=(xx,v,col,n)=>v?`<path data-tip="${esc(d.lab)} · ${n}: ${v}" d="M${xx},${y(0)} V${y(v)+4} q0,-4 4,-4 h${w-8} q4,0 4,4 V${y(0)} Z" fill="${col}"/>`:'';
    s+=r(x,d.c,'#1e5eff',names[0])+r(x+w+2,d.h,'#00a3b8',names[1]);
    if(i===data.length-1||d.c===max||d.h===max){if(d.c)s+=`<text class="lab" x="${x+w/2}" y="${y(d.c)-4}" text-anchor="middle">${d.c}</text>`;if(d.h)s+=`<text class="lab" x="${x+w*1.5+2}" y="${y(d.h)-4}" text-anchor="middle">${d.h}</text>`}
    s+=`<text x="${x+w+1}" y="${H-8}" text-anchor="middle">${esc(d.lab)}</text>`});
  return s+'</svg>'}

function circStats(code){const gs=corrsOf(code);const el=gs.reduce((a,g)=>a+(g.el||0),0),vot=gs.reduce((a,g)=>a+(g.vot||0),0);return {el,vot,part:el?vot/el:0,n:gs.length}}
function visitsByCorr(days){const T=today(),from=addDays(T,-days),m={};
  L('visitas').forEach(v=>{if(v.estado==='realizada'&&v.fecha>=from&&v.fecha<=T&&v.corrId)m[v.corrId]=(m[v.corrId]||0)+1});
  L('actividades').forEach(a=>{if(a.corrId&&a.desde>=from&&a.desde<=T&&a.estado!=='cancelada')m[a.corrId]=(m[a.corrId]||0)+1});return m}
function autoFoda(id){const g=GEOI.get(id);const f=[],d=[],o=[],a=[];if(!g)return {f,d,o,a};
  const lid=leaderOf(id);if(lid)f.push(`Tiene líder territorial: ${lid.nombre}.`);else d.push('No tiene líder territorial asignado.');
  const v90=visitsByCorr(90)[id]||0;const vAll=L('visitas').filter(v=>v.corrId===id&&v.estado==='realizada').sort((x,y)=>y.fecha.localeCompare(x.fecha));
  if(v90>=2)f.push(`Presencia constante: ${v90} visitas o actividades en 90 días.`);else if(!vAll.length&&!v90)d.push('Nunca lo hemos visitado.');else if(!v90)d.push(`Sin visitas desde ${fdate(vAll[0].fecha)}.`);
  const nx=L('visitas').filter(v=>v.corrId===id&&v.estado==='programada'&&v.fecha>=today()).sort((x,y)=>x.fecha.localeCompare(y.fecha))[0];if(nx)f.push(`Visita programada el ${fshort(nx.fecha).toLowerCase()}.`);
  const jov=L('visitas').filter(v=>v.corrId===id).reduce((s,v)=>s+(+v.jovenes||0),0);if(jov)f.push(`${fmt(jov)} jóvenes contactados en visitas.`);
  const late=L('tareas').filter(t=>t.corrId===id&&isLate(t)).length;if(late)d.push(`${late} tareas vencidas en este corregimiento.`);
  if(g.el){const cs=circStats(g.circ);const part=g.vot/g.el;const share=g.el/(cs.el||1);
    if(part>=cs.part+0.04)f.push(`Comunidad participativa: votó el ${Math.round(part*100)} % en 2024 (circuito ${Math.round(cs.part*100)} %).`);
    else if(part<=cs.part-0.04)d.push(`Participación baja: votó el ${Math.round(part*100)} % en 2024 (circuito ${Math.round(cs.part*100)} %).`);
    if(share>=1.5/(cs.n||1))o.push(`Peso alto en su circuito: ${Math.round(share*100)} % de los electores del ${g.circ}.`);
    if(g.val&&g.ganv&&g.ganv/g.val<0.3)o.push(`Voto muy repartido en la representación 2024: el ganador sacó ${Math.round(g.ganv/g.val*100)} %.`)}
  return {f,d,o,a}}

/* Motor del mapa */
const MP={k:1,tx:0,ty:0,base:1,ox:0,oy:0,cos:Math.cos(8.5*Math.PI/180),ptrs:new Map(),moved:false,ro:null,items:[],key:'',cache:{}};
const prj=(x,y)=>[(x+80)*MP.cos,-y];
function ringsToPath(rs){const p=new Path2D();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;rs.forEach(a=>{for(let i=0;i<a.length;i+=2){const [X,Y]=prj(a[i]/1e4,a[i+1]/1e4);i?p.lineTo(X,Y):p.moveTo(X,Y);x0=Math.min(x0,X);x1=Math.max(x1,X);y0=Math.min(y0,Y);y1=Math.max(y1,Y)}p.closePath()});return {p,bb:[x0,y0,x1,y1]}}
async function mapItems(){const code=UI.mapCirc;const key=code||'pais';if(MP.key===key&&MP.items.length)return MP.items;
  if(!code){MP.items=Object.entries(GEO.circ).map(([c,v])=>({kind:'circ',id:c,...ringsToPath(v.r),lab:c,cx:v.cx,cy:v.cy}))}
  else{let fs=MP.cache[code];if(!fs){try{fs=await (await fetch('c/'+code+'.json')).json();MP.cache[code]=fs}catch(e){toast('No se pudo cargar el circuito');fs=[]}}
    MP.items=fs.map(f=>{const g=GEOI.get(f.id)||{};return {kind:'corr',id:f.id,...ringsToPath(f.r),lab:g.c,cx:g.cx,cy:g.cy}});
    MP.outline=ringsToPath(GEO.circ[code].r)}
  MP.key=key;MP.fitKey=null;return MP.items}
function mapFit(cv){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;MP.items.forEach(it=>{x0=Math.min(x0,it.bb[0]);y0=Math.min(y0,it.bb[1]);x1=Math.max(x1,it.bb[2]);y1=Math.max(y1,it.bb[3])});
  const w=cv.clientWidth,h=cv.clientHeight;MP.base=Math.min(w/(x1-x0||1),h/(y1-y0||1))*0.9;MP.k=1;MP.ox=x0;MP.oy=y0;MP.tx=(w-(x1-x0)*MP.base)/2;MP.ty=(h-(y1-y0)*MP.base)/2}
const scr=()=>{const s=MP.base*MP.k;return {s,tx:MP.tx-MP.ox*s,ty:MP.ty-MP.oy*s}};
function drawMap(){const cv=$('#map');if(!cv||!MP.items.length)return;const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;const w=cv.clientWidth,h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);const {s,tx,ty}=scr();const cf=colorFns();
  ctx.setTransform(dpr*s,0,0,dpr*s,dpr*tx,dpr*ty);ctx.lineJoin='round';
  MP.items.forEach(it=>{ctx.fillStyle=it.kind==='circ'?cf.circ(it.id):cf.corr(GEOI.get(it.id)||{});ctx.fill(it.p);ctx.strokeStyle='#ffffff';ctx.lineWidth=(it.kind==='circ'?1.6:0.9)/s;ctx.stroke(it.p)});
  if(MP.outline&&UI.mapCirc){ctx.strokeStyle='#071a3d';ctx.lineWidth=2.2/s;ctx.stroke(MP.outline.p)}
  const hi=(id,col,lw)=>{const it=MP.items.find(x=>x.id===id);if(it){ctx.strokeStyle=col;ctx.lineWidth=lw/s;ctx.stroke(it.p)}};
  if(MP.hover&&MP.hover!==UI.mapSel)hi(MP.hover,'#00cfe0',3);if(UI.mapSel)hi(UI.mapSel,'#071a3d',3.5);
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.textAlign='center';
  MP.items.forEach(it=>{const bw=(it.bb[2]-it.bb[0])*s;const isC=it.kind==='circ';if(!isC&&bw<54)return;if(isC&&bw<18)return;const [x,y]=prj(it.cx,it.cy);const X=x*s+tx,Y=y*s+ty;if(X<0||Y<0||X>w||Y>h)return;
    ctx.font=isC?'800 11px Unbounded, sans-serif':'800 11px Manrope, sans-serif';ctx.lineWidth=3.5;ctx.strokeStyle='rgba(255,255,255,.92)';ctx.fillStyle='#071a3d';ctx.strokeText(it.lab||'',X,Y);ctx.fillText(it.lab||'',X,Y)});
  const lg=$('#maplegend');if(lg)lg.innerHTML=`<span>${esc(cf.note)}</span>`+cf.legend.map(([c,n])=>`<span><i style="background:${c}"></i>${n}</span>`).join('')}
function hitTest(px,py){const cv=$('#map');const ctx=cv.getContext('2d');const {s,tx,ty}=scr();const x=(px-tx)/s,y=(py-ty)/s;ctx.setTransform(1,0,0,1,0,0);
  for(const it of MP.items){if(x<it.bb[0]||x>it.bb[2]||y<it.bb[1]||y>it.bb[3])continue;if(ctx.isPointInPath(it.p,x,y))return it}return null}
function zoomAt(f,px,py){const k=Math.max(0.7,Math.min(80,MP.k*f));f=k/MP.k;MP.tx=px-(px-MP.tx)*f;MP.ty=py-(py-MP.ty)*f;MP.k=k;drawMap()}
function zoomTo(id){const it=MP.items.find(x=>x.id===id);const cv=$('#map');if(!it||!cv)return;const w=cv.clientWidth,h=cv.clientHeight;const bb=it.bb;
  const k=Math.max(1,Math.min(80,Math.min(w/((bb[2]-bb[0])*MP.base),h/((bb[3]-bb[1])*MP.base))*0.5));MP.k=k;const s=MP.base*k;MP.tx=w/2-((bb[0]+bb[2])/2-MP.ox)*s;MP.ty=h/2-((bb[1]+bb[3])/2-MP.oy)*s;drawMap()}
async function mountMap(){const cv=$('#map');if(!cv||!GEO)return;await mapItems();if(!cv.isConnected)return;
  const fk=MP.key+'|'+cv.clientWidth;if(MP.fitKey!==fk){mapFit(cv);MP.fitKey=fk;if(UI.mapSel&&UI.mapCirc){drawMap();zoomTo(UI.mapSel)}}
  drawMap();
  if(MP.ro)MP.ro.disconnect();MP.ro=new ResizeObserver(()=>{if(cv.isConnected&&MP.key+'|'+cv.clientWidth!==MP.fitKey){mapFit(cv);MP.fitKey=MP.key+'|'+cv.clientWidth;drawMap()}});MP.ro.observe(cv);
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);MP.ptrs.set(e.pointerId,pos(e));MP.moved=false;MP.start=pos(e);cv.classList.add('drag')};
  cv.onpointermove=e=>{const p=pos(e);
    if(MP.ptrs.has(e.pointerId)){const prev=MP.ptrs.get(e.pointerId);
      if(MP.ptrs.size===2){const o=[...MP.ptrs.entries()].filter(([k])=>k!==e.pointerId).map(x=>x[1])[0];const d0=Math.hypot(prev[0]-o[0],prev[1]-o[1]),d1=Math.hypot(p[0]-o[0],p[1]-o[1]);if(d0>0)zoomAt(d1/d0,(p[0]+o[0])/2,(p[1]+o[1])/2);MP.moved=true}
      else{MP.tx+=p[0]-prev[0];MP.ty+=p[1]-prev[1];if(Math.hypot(p[0]-MP.start[0],p[1]-MP.start[1])>4)MP.moved=true;drawMap()}
      MP.ptrs.set(e.pointerId,p);return}
    if(e.pointerType==='mouse'){const it=hitTest(p[0],p[1]);const tip=$('#tip');
      if(it){tip.hidden=false;if(it.kind==='circ'){const c=GEO.circ[it.id];tip.textContent=`Circuito ${it.id} · ${c.p} · ${fmt(c.el)} electores`}else{const g=GEOI.get(it.id)||{};tip.textContent=`${g.c} · ${g.el?fmt(g.el)+' electores':'sin dato'}`}tip.style.left=p[0]+'px';tip.style.top=p[1]+'px'}else tip.hidden=true;
      const id=it&&it.id;if(id!==MP.hover){MP.hover=id;drawMap()}}};
  const up=e=>{const p=pos(e);MP.ptrs.delete(e.pointerId);cv.classList.remove('drag');if(!MP.moved&&MP.ptrs.size===0){const it=hitTest(p[0],p[1]);if(it){if(it.kind==='circ'){UI.mapCirc=it.id;UI.mapSel=null;MP.hover=null;render()}else{UI.mapSel=it.id;render()}}}};
  cv.onpointerup=up;cv.onpointercancel=e=>{MP.ptrs.delete(e.pointerId);cv.classList.remove('drag')};
  cv.onpointerleave=()=>{const t=$('#tip');if(t)t.hidden=true;if(MP.hover){MP.hover=null;drawMap()}};
  cv.onwheel=e=>{e.preventDefault();const p=pos(e);zoomAt(e.deltaY<0?1.25:0.8,p[0],p[1])}}

function vCobertura(){if(!GEO)return '<div class="empty">Cargando…</div>';const T=today();const weeks=UI.heat==='semanas';const N=weeks?16:12;const cols=[];
  if(weeks){const m=monday(T);for(let i=N-1;i>=0;i--){const s=addDays(m,-7*i);cols.push({s,e:addDays(s,6),lab:`${pd(s).getDate()} ${M3[pd(s).getMonth()]}`})}}
  else{const d=pd(T);for(let i=N-1;i>=0;i--){const s=new Date(d.getFullYear(),d.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()-i+1,0);cols.push({s:iso(s),e:iso(e),lab:M3[s.getMonth()]})}}
  const ev=[];L('visitas').forEach(v=>{if(v.estado==='realizada'&&GEOI.get(v.corrId))ev.push({id:v.corrId,f:v.fecha})});L('actividades').forEach(a=>{if(a.corrId&&GEOI.get(a.corrId)&&a.desde&&a.desde<=T&&a.estado!=='cancelada')ev.push({id:a.corrId,f:a.desde})});
  const cell=xs=>cols.map(c=>{const n=xs.filter(x=>x.f>=c.s&&x.f<=c.e).length;const op=n?Math.min(1,.25+n*.2):0;return `<td style="background:${n?`rgba(30,94,255,${op})`:'#eef3f9'};color:${op>.6?'#fff':'var(--navy)'}" title="${n} visitas">${n||''}</td>`}).join('');
  const last=xs=>{const f=xs.map(x=>x.f).sort().pop();return f?`hace ${diffDays(f,T)} días`:'nunca'};
  const rows=PROVS.map(p=>{const xs=ev.filter(x=>GEOI.get(x.id).p===p);const open=UI.open[p];const cs=CIRC_BY_PROV[p]||[];

  const total=ev.filter(x=>x.f>=cols[0].s).length;const provsHit=new Set(ev.filter(x=>x.f>=cols[0].s).map(x=>GEOI.get(x.id).p)).size;
  const cold=[...new Set(ev.map(x=>x.id))].map(id=>({id,f:ev.filter(x=>x.id===id).map(x=>x.f).sort().pop()})).filter(x=>diffDays(x.f,T)>60).sort((a,b)=>a.f.localeCompare(b.f));
  return `<div class="vhead"><div class="t"><span class="eyebrow">Territorio</span><h1>Frecuencia de visitas</h1></div><div class="row"><button class="btn pri" data-a="newVisit" data-done="1">Registrar visita hecha</button><div class="seg">${[['semanas','16 semanas'],['meses','12 meses']].map(([k,n])=>`<button data-a="heat" data-v="${k}" aria-pressed="${UI.heat===k}">${n}</button>`).join('')}</div></div></div>
  <div class="note small"><b>Cómo se cuenta una visita:</b> cuenta toda visita marcada como realizada (desde la agenda, el mapa o aquí) y toda actividad con corregimiento. Si creas una tarea de tipo "Visita" con su corregimiento, al marcarla hecha se registra sola.</div>
  <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="kpi"><span>Visitas en el periodo</span><b>${total}</b></div><div class="kpi"><span>Provincias con presencia</span><b>${provsHit}/${PROVS.length}</b></div><div class="kpi ${cold.length?'bad':''}"><span>Se están enfriando</span><b>${cold.length}</b><small>60+ días sin volver</small></div></div>
  <section class="panel"><div class="tscroll"><table class="heat"><thead><tr><th class="n">Territorio</th>${cols.map(c=>`<th>${c.lab}</th>`).join('')}<th style="text-align:left">Última</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  ${cold.length?`<section class="flat"><header><h2>Por retomar</h2></header><div class="chips">${cold.slice(0,20).map(x=>`<button class="tag" data-a="goCorr" data-id="${x.id}">${esc(corrName(x.id))} · ${diffDays(x.f,T)} días</button>`).join('')}</div></section>`:''}`}

async function inflateRaw(u8){const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function unzip(buf){const dv=new DataView(buf),u8=new Uint8Array(buf),td=new TextDecoder();let e=buf.byteLength-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const fs={};
  for(let i=0;i<n&&dv.getUint32(p,true)===0x02014b50;i++){const nl=dv.getUint16(p+28,true);fs[td.decode(u8.subarray(p+46,p+46+nl))]={m:dv.getUint16(p+10,true),sz:dv.getUint32(p+20,true),lo:dv.getUint32(p+42,true)};p+=46+nl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true)}
  return {names:Object.keys(fs),async text(name){const f=fs[name];if(!f)return '';const st=f.lo+30+dv.getUint16(f.lo+26,true)+dv.getUint16(f.lo+28,true);const raw=u8.subarray(st,st+f.sz);return td.decode(f.m===8?await inflateRaw(raw):raw)}}}
async function xlsxRows(buf){const z=await unzip(buf);const xml=s=>new DOMParser().parseFromString(s,'application/xml');const tx=el=>[...el.getElementsByTagName('t')].map(t=>t.textContent).join('');
  const ss=[];const sst=await z.text('xl/sharedStrings.xml');if(sst)[...xml(sst).getElementsByTagName('si')].forEach(si=>ss.push(tx(si)));
  let best=[];for(const name of z.names.filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x))){const rows=[];
    [...xml(await z.text(name)).getElementsByTagName('row')].forEach(r=>{const row=[];[...r.getElementsByTagName('c')].forEach(c=>{const m=(c.getAttribute('r')||'').match(/^[A-Z]+/);let ci=row.length;if(m){ci=0;for(const ch of m[0])ci=ci*26+ch.charCodeAt(0)-64;ci--}
        const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val=t==='s'?(ss[+(v?v.textContent:-1)]||''):t==='inlineStr'?tx(c):(v?v.textContent:'');if(/^\d+(\.\d+)?E\+?\d+$/i.test(val))val=String(Number(val));row[ci]=String(val).trim()});
      if(row.some(x=>x))rows.push(Array.from(row,x=>x||''))});
    if(rows.length>best.length)best=rows}
  return best}
function textRows(txt){const lines=String(txt||'').replace(/\r/g,'').split('\n').filter(l=>l.trim());if(!lines.length)return [];
  const cnt=ch=>lines.filter(l=>l.includes(ch)).length;const d=cnt('\t')?'\t':cnt(';')>lines.length/2?';':cnt(',')>lines.length/2?',':'\t';
  return lines.map(l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"'&&!cur)q=true;else if(ch===d){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out})}
function impDetect(){const rows=IMP.rows,m=IMP.map;const h=(rows[0]||[]).map(norm);const find=re=>h.findIndex(x=>re.test(x));
  m.hdr=h.some(x=>/^(nombre|nombres|apellido|apellidos|telefono|celular|whatsapp|corregimiento|provincia|cedula|nombre completo|nombre y apellido)/.test(x));
  const body=rows.slice(m.hdr?1:0,60);const cols=Math.max(0,...rows.slice(0,60).map(r=>r.length));const frac=(c,f)=>body.length?body.filter(r=>f(r[c]||'')).length/body.length:0;
  const isPhone=v=>{const dg=v.replace(/\D/g,'');return dg.length>=7&&dg.length<=11&&!/[a-z]{3}/i.test(v)&&!/^\d-\d+-\d+$/.test(v.trim())};
  if(m.hdr){m.nombre=find(/nombre|name/);m.apellido=find(/apellido/);m.telefono=find(/tel|cel|whats|movil|contacto/);m.lugar=find(/corregimiento|comunidad|barrio|direccion|lugar|residencia/);m.provincia=find(/provincia/)}
  else{m.nombre=-1;m.apellido=-1;m.telefono=-1;m.lugar=-1;m.provincia=-1}
  if(m.nombre<0)for(let c=0;c<cols;c++)if(c!==m.apellido&&frac(c,v=>/[a-zñáéíóú]{2}/i.test(v)&&!/\d{4}/.test(v))>.6){m.nombre=c;break}
  if(m.telefono<0)for(let c=0;c<cols;c++)if(c!==m.nombre&&frac(c,isPhone)>.5){m.telefono=c;break}
  if(!m.hdr&&m.lugar<0)for(let c=0;c<cols;c++)if(c!==m.nombre&&c!==m.telefono&&frac(c,v=>/[a-zñáéíóú]{3}/i.test(v)&&!v.includes('@'))>.5){m.lugar=c;break}
  if(m.nombre<0)m.nombre=0}
function impPeople(){const m=IMP.map;const seen=new Set(),out=[];let dup=0,bad=0;const ex=L('personas');const key=(n,t)=>norm(n)+'|'+String(t||'').replace(/\D/g,'');
  const have=new Map();ex.forEach(p=>{const k=norm(p.nombre);(have.get(k)||have.set(k,[]).get(k)).push(String(p.telefono||'').replace(/\D/g,''))});
  IMP.rows.slice(m.hdr?1:0).forEach(r=>{const g=c=>c>=0?String(r[c]||'').trim():'';const nombre=(g(m.nombre)+' '+g(m.apellido)).replace(/\s+/g,' ').trim();
    if(!nombre||!/[a-zñáéíóú]{2}/i.test(nombre)){bad++;return}
    const tel=g(m.telefono).replace(/[^\d+\-\s]/g,'').trim(),td=tel.replace(/\D/g,'');const k=key(nombre,tel);
    const old=have.get(norm(nombre));if(seen.has(k)||(old&&old.some(t=>!t||!td||t===td))){dup++;return}seen.add(k);
    let lugar=g(m.lugar),prov=g(m.provincia);const pv=PROVS.find(x=>norm(x)===norm(prov));if(prov&&!pv)lugar=[lugar,prov].filter(Boolean).join(', ');
    out.push({nombre,telefono:tel,lugar,provincia:pv||''})});
  return {out,dup,bad}}
function impPreview(){const host=$('#impPrev'),go=$('#impGo');if(!host)return;

   ${cols>1?`<div class="grid2">${sel('nombre','Columna del nombre',true)}${sel('apellido','Apellido, si viene aparte')}${sel('telefono','Teléfono')}${sel('lugar','Corregimiento o comunidad')}${sel('provincia','Provincia')}<label class="row small"><input type="checkbox" data-imp="hdr" ${m.hdr?'checked':''}> La primera fila son los títulos</label></div>`:''}
   ${out.length?`<div class="tscroll"><table><thead><tr><th>Nombre</th><th>Teléfono</th><th>Lugar</th></tr></thead><tbody>${out.slice(0,5).map(p=>`<tr><td>${esc(p.nombre)}</td><td class="num">${esc(p.telefono||'—')}</td><td>${esc([p.lugar,p.provincia].filter(Boolean).join(', ')||'—')}</td></tr>`).join('')}</tbody></table></div>${out.length>5?`<span class="muted small">Así quedan las primeras 5 de ${fmt(out.length)}.</span>`:''}`:''}`;

async function impFile(file){IMP.err='';IMP.rows=[];IMP.src=file.name;const host=$('#impPrev');if(host)host.innerHTML='<span class="muted small">Leyendo el archivo…</span>';

/* Agrega uno o varios nombres a una lista (asistentes de una reunión, quiénes van a una actividad). Si el nombre está en Estructura se enlaza; si no, queda como texto. */
function addNames(col,id,arr,flag,val,texto,form){const o=S[col][id];const ns=splitNames(texto);if(!o||!ns.length)return;const list=o[arr]=o[arr]||[];let n=0;
  ns.forEach(x=>{const p=findPersona(x);if(list.some(a=>p?a.personaId===p.id:(!a.personaId&&norm(a.nombre)===norm(x))))return;list.push(p?{personaId:p.id,[flag]:val}:{nombre:x,[flag]:val});n++});
  if(n)put(col,o);else toast('Ya estaba en la lista');render();const i=document.querySelector(`form[data-a-submit="${form}"][data-id="${id}"] input[name=nombres]`);if(i)i.focus()}
function bindField(el){const [col,id,path]=el.dataset.f.split('|');const o=S[col][id]||(col==='territorio'?{id}:null);if(!o)return null;
  let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.t==='num')v=el.value===''?null:+el.value;setPath(o,path,v);put(col,o);return o}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.f&&el.type!=='checkbox'&&el.tagName!=='SELECT'&&el.type!=='number')bindField(el);
  if('mirror' in el.dataset){const c=el.closest('.acard');const nm=c&&c.querySelector('.item .nm');if(nm)nm.textContent=el.value||'Sin nombre'}
  if(el.dataset.q){const k=el.dataset.q;UI[k]=el.value;UI.estN=60;clearTimeout(el._t);el._t=setTimeout(()=>{render();const i=document.querySelector(`[data-q="${k}"]`);if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},350)}
  if(el.id==='impText'){clearTimeout(el._t);el._t=setTimeout(()=>impText(el.value),300)}
  if(el.dataset.tf==='q'){UI.tf.q=el.value;clearTimeout(el._t);el._t=setTimeout(()=>{render();const i=document.querySelector('[data-tf="q"]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},350)}});
document.addEventListener('change',e=>{const el=e.target;
  if(el.dataset.pick){const [col,id,path]=el.dataset.pick.split('|');const o=S[col][id];if(o){const v=el.value.trim();const p=findPersona(v);setPath(o,path+'.personaId',p?p.id:'');setPath(o,path+'.nombre',p?'':v);put(col,o);const c=el.closest('.rolec');if(c)c.classList.toggle('ok',!!v)}}
  if(el.dataset.f&&(el.type==='checkbox'||el.tagName==='SELECT'||el.type==='date'||el.type==='number'||el.type==='time')){bindField(el);if(el.dataset.rr)render()}
  if(el.dataset.corr){const [col,id,path]=el.dataset.corr.split('|');const cid=LABEL2ID[el.value];if(el.value&&!cid){toast('Elige un corregimiento de la lista');return}const o=S[col][id];setPath(o,path,cid||'');put(col,o,0);render()}
  if(el.dataset.circ){const code=el.dataset.circ;const c=S.circuitos['c'+code]||{id:'c'+code,codigo:code,lideres:{}};c[el.dataset.k]=el.value;put('circuitos',c,0);render()}

  if(el.dataset.imp){IMP.map[el.dataset.imp]=el.type==='checkbox'?el.checked:+el.value;impPreview()}
